<script>window.__SCREENS__ = {"Admin.dc.html": {"markup": "<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #130F1C; color: #F1ECFA; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden\">\n<header style=\"padding: 48px 20px 8px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<div style=\"display: flex; align-items: center; gap: 6px\">\n<a href=\"Menu.dc.html\" aria-label=\"Menu\" style=\"width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; background: #1E182C; border: 1px solid #2E2642; color: #F1ECFA; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M4 7h16M4 12h16M4 17h16\"><\/path><\/svg><\/a>\n<a href=\"Settings.dc.html\" data-back=\"1\" aria-label=\"Back to previous page\" style=\"width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; background: #1E182C; border: 1px solid #2E2642; color: #F1ECFA; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 6-6 6 6 6\"><\/path><\/svg><\/a>\n<\/div>\n<div style=\"display: flex; align-items: center; gap: 8px\">\n<div style=\"display: flex; align-items: center; gap: 8px\">\n<a href=\"Notifications.dc.html\" aria-label=\"Notifications, 6 new\" style=\"position: relative; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; background: #1E182C; border: 1px solid #2E2642; color: #F1ECFA; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8\"><\/path><path d=\"M10.3 21a1.9 1.9 0 0 0 3.4 0\"><\/path><\/svg><span aria-hidden=\"true\" style=\"position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 2px solid #130F1C; background: #C69BFF; color: #130F1C; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 3px\">6<\/span><\/a>\n<a href=\"Settings.dc.html\" aria-label=\"Settings\" style=\"width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; background: #1E182C; border: 1px solid #2E2642; color: #F1ECFA; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\/circle><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"><\/path><\/svg><\/a>\n<\/div>\n<button type=\"button\" onClick=\"{{save}}\" disabled=\"{{saveDisabled}}\" style=\"{{saveStyle}}\">{{saveLabel}}<\/button>\n<\/div>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<span style=\"font-size: 13px; font-weight: 600; color: #ADA3C2\">The Late Shift · admins only<\/span>\n<h1 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 600; letter-spacing: -0.01em\">Band admin<\/h1>\n<\/div>\n<\/header>\n\n<main style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 32px; display: flex; flex-direction: column; gap: 20px\">\n\n<section aria-label=\"Roles\" style=\"display: flex; flex-direction: column; gap: 8px\">\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600\">Roles<\/h2>\n<span style=\"font-size: 13px; color: #ADA3C2\">Tap a role to change it. A band always needs at least one admin.<\/span>\n<div style=\"background: #1E182C; border: 1px solid #2E2642; border-radius: 16px; display: flex; flex-direction: column\">\n<sc-for list=\"{{roleRows}}\" as=\"m\" hint-placeholder-count=\"4\">\n<div style=\"{{m.rowStyle}}\">\n<span style=\"{{m.avatarStyle}}\">{{m.initial}}<\/span>\n<span style=\"flex: 1; font-size: 15px; font-weight: 500\">{{m.name}}<\/span>\n<button type=\"button\" aria-label=\"{{m.roleAria}}\" onClick=\"{{m.cycle}}\" style=\"{{m.roleStyle}}\">{{m.role}}\n<svg aria-hidden=\"true\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\/path><\/svg>\n<\/button>\n<\/div>\n<\/sc-for>\n<\/div>\n<sc-if value=\"{{hasRoleNote}}\" hint-placeholder-val=\"{{false}}\">\n<span role=\"status\" style=\"font-size: 13px; color: #F2B880\">{{roleNote}}<\/span>\n<\/sc-if>\n<\/section>\n\n<section aria-label=\"Permissions\" style=\"display: flex; flex-direction: column; gap: 8px\">\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600\">Who can…<\/h2>\n<div style=\"background: #1E182C; border: 1px solid #2E2642; border-radius: 16px; display: flex; flex-direction: column\">\n<sc-for list=\"{{perms}}\" as=\"p\" hint-placeholder-count=\"5\">\n<div style=\"{{p.rowStyle}}\">\n<span style=\"flex: 1; font-size: 14px; font-weight: 500\">{{p.label}}<\/span>\n<div role=\"radiogroup\" aria-label=\"{{p.label}}\" style=\"display: flex; gap: 2px; background: #130F1C; border-radius: 10px; padding: 3px; flex-shrink: 0\">\n<button type=\"button\" role=\"radio\" aria-checked=\"{{p.adminChecked}}\" onClick=\"{{p.setAdmin}}\" style=\"{{p.adminStyle}}\">Admins<\/button>\n<button type=\"button\" role=\"radio\" aria-checked=\"{{p.allChecked}}\" onClick=\"{{p.setAll}}\" style=\"{{p.allStyle}}\">Members<\/button>\n<\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n<span style=\"font-size: 12px; color: #ADA3C2\">Guests can only see the calendar, chat and media.<\/span>\n<\/section>\n\n<section aria-label=\"Payout percentages\" style=\"display: flex; flex-direction: column; gap: 8px\">\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600\">Payout percentages<\/h2>\n<span style=\"font-size: 13px; color: #ADA3C2\">How Square payouts are split. Must add up to 100%.<\/span>\n<div style=\"background: #1E182C; border: 1px solid #2E2642; border-radius: 16px; display: flex; flex-direction: column\">\n<sc-for list=\"{{shares}}\" as=\"s\" hint-placeholder-count=\"4\">\n<div style=\"{{s.rowStyle}}\">\n<span style=\"{{s.avatarStyle}}\">{{s.initial}}<\/span>\n<span style=\"flex: 1; font-size: 15px; font-weight: 500\">{{s.name}}<\/span>\n<button type=\"button\" aria-label=\"{{s.minusAria}}\" onClick=\"{{s.minus}}\" style=\"width: 44px; height: 44px; border-radius: 22px; background: #282038; border: 0; color: #F1ECFA; font: 600 20px Inter, sans-serif; cursor: pointer\">−<\/button>\n<span aria-live=\"polite\" style=\"width: 52px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600\">{{s.pct}}<\/span>\n<button type=\"button\" aria-label=\"{{s.plusAria}}\" onClick=\"{{s.plus}}\" style=\"width: 44px; height: 44px; border-radius: 22px; background: #282038; border: 0; color: #F1ECFA; font: 600 20px Inter, sans-serif; cursor: pointer\">+<\/button>\n<\/div>\n<\/sc-for>\n<div style=\"display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid #2E2642\">\n<span style=\"font-size: 14px; font-weight: 600\">Total<\/span>\n<span style=\"{{totalStyle}}\">{{totalLabel}}<\/span>\n<\/div>\n<\/div>\n<div style=\"display: flex; gap: 8px\">\n<button type=\"button\" onClick=\"{{evenSplit}}\" style=\"flex: 1; min-height: 44px; border-radius: 12px; background: transparent; border: 1px solid #3D3354; color: #F1ECFA; font: 600 14px Inter, sans-serif; cursor: pointer\">Split evenly<\/button>\n<button type=\"button\" onClick=\"{{agreedSplit}}\" style=\"flex: 1; min-height: 44px; border-radius: 12px; background: transparent; border: 1px solid #3D3354; color: #F1ECFA; font: 600 14px Inter, sans-serif; cursor: pointer\">Songwriter split<\/button>\n<\/div>\n<\/section>\n\n<section aria-label=\"Payout rules\" style=\"display: flex; flex-direction: column; gap: 8px\">\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600\">Payout rules<\/h2>\n<div style=\"background: #1E182C; border: 1px solid #2E2642; border-radius: 16px; display: flex; flex-direction: column\">\n<div style=\"display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #2E2642\">\n<span style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; font-weight: 500\">Keep in the band fund<\/span><span style=\"font-size: 12px; color: #ADA3C2\">Set aside before each payout<\/span><\/span>\n<button type=\"button\" aria-label=\"Lower band fund amount\" onClick=\"{{fundMinus}}\" style=\"width: 44px; height: 44px; border-radius: 22px; background: #282038; border: 0; color: #F1ECFA; font: 600 20px Inter, sans-serif; cursor: pointer\">−<\/button>\n<span aria-live=\"polite\" style=\"width: 52px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600\">{{fund}}<\/span>\n<button type=\"button\" aria-label=\"Raise band fund amount\" onClick=\"{{fundPlus}}\" style=\"width: 44px; height: 44px; border-radius: 22px; background: #282038; border: 0; color: #F1ECFA; font: 600 20px Inter, sans-serif; cursor: pointer\">+<\/button>\n<\/div>\n<div style=\"display: flex; align-items: center; gap: 12px; padding: 12px 16px\">\n<span style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; font-weight: 500\">Second admin must approve<\/span><span style=\"font-size: 12px; color: #ADA3C2\">Payouts over $1,000<\/span><\/span>\n<button type=\"button\" role=\"switch\" aria-checked=\"{{approveChecked}}\" aria-label=\"Second admin must approve payouts over $1,000\" onClick=\"{{toggleApprove}}\" style=\"{{approveSwitch}}\"><span style=\"width: 26px; height: 26px; border-radius: 13px; background: #F1ECFA; display: block\"><\/span><\/button>\n<\/div>\n<\/div>\n<span style=\"font-size: 12px; color: #ADA3C2\">Every member gets a notification when the split or the rules change.<\/span>\n<\/section>\n<section aria-label=\"Deposits\" style=\"display: flex; flex-direction: column; gap: 8px\">\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600\">Deposits<\/h2>\n<span style=\"font-size: 13px; color: #ADA3C2\">Filled in automatically when you accept a booking. You can change it per show.<\/span>\n<div style=\"background: #1E182C; border: 1px solid #2E2642; border-radius: 16px; display: flex; flex-direction: column\">\n<div style=\"display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #2E2642\">\n<span style=\"flex: 1; font-size: 14px; font-weight: 500\">Ask for a deposit on every booking<\/span>\n<button type=\"button\" role=\"switch\" aria-checked=\"{{depChecked}}\" aria-label=\"Ask for a deposit on every booking\" onClick=\"{{toggleDep}}\" style=\"{{depSwitch}}\"><span style=\"width: 26px; height: 26px; border-radius: 13px; background: #F1ECFA; display: block\"><\/span><\/button>\n<\/div>\n<div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 16px; border-bottom: 1px solid #2E2642\">\n<span style=\"flex: 1; font-size: 14px; font-weight: 500\">Deposit amount<\/span>\n<button type=\"button\" aria-label=\"Lower deposit percent\" onClick=\"{{depMinus}}\" style=\"width: 44px; height: 44px; border-radius: 22px; background: #282038; border: 0; color: #F1ECFA; font: 600 20px Inter, sans-serif; cursor: pointer\">−<\/button>\n<span aria-live=\"polite\" style=\"width: 52px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600\">{{depPct}}<\/span>\n<button type=\"button\" aria-label=\"Raise deposit percent\" onClick=\"{{depPlus}}\" style=\"width: 44px; height: 44px; border-radius: 22px; background: #282038; border: 0; color: #F1ECFA; font: 600 20px Inter, sans-serif; cursor: pointer\">+<\/button>\n<\/div>\n<div style=\"display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #2E2642\"><span style=\"font-size: 14px\">Due<\/span><span style=\"font-size: 14px; color: #D3CCE3\">Within 14 days<\/span><\/div>\n<div style=\"display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px\"><span style=\"font-size: 14px\">If cancelled<\/span><span style=\"font-size: 14px; color: #D3CCE3; text-align: right\">Non-refundable within 14 days<\/span><\/div>\n<\/div>\n<\/section>\n\n<section aria-label=\"W-9 forms\" style=\"display: flex; flex-direction: column; gap: 8px\">\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600\">W-9 forms<\/h2>\n<div style=\"background: #1E182C; border: 1px solid #2E2642; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-size: 14px; line-height: 1.45; color: #D3CCE3\">Venues and bookers often ask for a W-9 before they pay you. We recommend filling one out now so it’s ready to send.<\/span>\n<a href=\"https://www.irs.gov/pub/irs-pdf/fw9.pdf\" style=\"min-height: 48px; border-radius: 12px; background: #C69BFF; color: #130F1C; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center\">Download the latest W-9 (IRS)<\/a>\n<a href=\"https://www.irs.gov/FormW9\" style=\"min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600\">Instructions and updates on IRS.gov<\/a>\n<span style=\"font-size: 12px; color: #ADA3C2; line-height: 1.4\">Tip: save your filled-out copy in Media › Contracts so anyone with admin access can find it. Fame Plan doesn’t store your tax ID. Ask your accountant if you’re unsure how to fill it out.<\/span>\n<\/div>\n<\/section>\n<\/main>\n<\/div>", "script": "class Component extends DCLogic {\nconstructor(props) {\nsuper(props);\nthis.state = {\nroles: { M: 'Admin', D: 'Admin', S: 'Member', J: 'Member' },\nperms: { payouts: 'admin', budget: 'admin', page: 'all', invite: 'admin', calendar: 'all' },\nshares: { M: 30, D: 30, S: 20, J: 20 },\nfund: 500,\napprove: true,\ndepOn: true, depPct: 25, taxClass: 'LLC (partnership)',\nroleNote: '',\nsaved: true\n};\n}\nrenderVals() {\nvar self = this;\nvar st = this.state;\nvar people = [['M', 'Maya', '#F2B880'], ['D', 'Dev (you)', '#8EC5FC'], ['S', 'Sam', '#B5E3B0'], ['J', 'Jo', '#D7B8F3']];\nfunction avatar(c) { return 'width: 36px; height: 36px; border-radius: 18px; flex-shrink: 0; background: ' + c + '; color: #130F1C; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center'; }\nfunction row(i, n, pad) { return 'display: flex; align-items: center; gap: 10px; padding: ' + (pad || '10px 16px') + (i < n - 1 ? '; border-bottom: 1px solid #2E2642' : ''); }\nfunction dirty(p) { p.saved = false; self.setState(p); }\nvar cycle = ['Admin', 'Member', 'Guest'];\nvar roleRows s: provides,\npay: '$' + st.pay,\npayMinus: function () { self.setState({ pay: Math.max(0, self.state.pay - 50) }); },\npayPlus: function () { self.setState({ pay: self.state.pay + 50 }); },\nbelowMin: st.pay < 300,\nnotSent: !st.sent, sent: st.sent,\nsend: function (e) { if (e && e.preventDefault) e.preventDefault(); self.setState({ sent: true }); },\nsummary: st.type + ' set at The Anchor Room on Sat, Jan 16 · ' + st.len + ' min · $' + st.pay + doorText + '.'\n};\n}\n}", "title": "Fame Plan — Request to book (booker view)"}, "BookerInbox.dc.html": {"markup": "<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #130F1C; color: #F1ECFA; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden\">\n<header style=\"padding: 48px 20px 8px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; margin-left: -4px; flex-basis: 100%; width: 100%\">\n<a href=\"Menu.dc.html\" aria-label=\"Menu\" style=\"width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; background: #1E182C; border: 1px solid #2E2642; color: #F1ECFA; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M4 7h16M4 12h16M4 17h16\"><\/path><\/svg><\/a>\n<a href=\"Main.dc.html\" data-back=\"1\" aria-label=\"Back to previous page\" style=\"width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; background: #1E182C; border: 1px solid #2E2642; color: #F1ECFA; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: 8px\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 6-6 6 6 6\"><\/path><\/svg><\/a>\n<\/div>\n<div style= counter[r.id] || 0;\nvar note = st.notes[r.id] || '';\nvar thread = r.thread.concat(st.extra[r.id] || []).map(function (m) {\nreturn { who: m.who, time: m.time, offer: m.offer, text: m.text, hasText: !!m.text,\nwrapStyle: 'display: flex; flex-direction: column; gap: 3px; max-width: 88%; ' + (m.mine ? 'align-self: flex-end; align-items: flex-end' : 'align-self: flex-start'),\nbubbleStyle: 'display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; ' + (m.mine ? 'background: #282038; border-radius: 12px 4px 12px 12px' : 'background: #261C3A; border: 1px solid #5A3F8A; border-radius: 4px 12px 12px 12px') };\n});\nvar badges = { 'their-counter': ['Your move', '#130F1C', '#C69BFF'], waiting: ['Waiting on band', '#D3CCE3', '#282038'], 'you-countered': ['Waiting on band', '#D3CCE3', '#282038'], booked: ['Booked', '#130F1C', '#B5E3B0'], accepted: ['Booked', '#130F1C', '#B5E3B0'], passed: ['Passed', '#D3CCE3', '#282038'] }[s];\nvar statusText = { waiting: 'Sent Sun · Glass Harbor usually replies within a day.', 'you-countered': 'Counter sent. You’ll be notified when they answer.', accepted: 'Booked at ' + money(r.theirAsk) + '. It’s on the band’s calendar. The band asked for a deposit to hold the date.', booked: 'Booked. It’s on both calendars.', passed: 'You passed on this one. The band was notified politely.' }[s] || '';\nvar booked = s === 'accepted' || s === 'booked';\nvar depAmount = r.id === 'vs' ? 115 : Math.round((r.theirAsk || 0) * 0.25);\nvar paid = !!st.paid[r.id];\nvar w9 = st.w9[r.id];\nvar phrases = ['Can we meet in the middle?', 'We can add a drum kit.', 'Door split goes up after 150 tickets.', 'Happy to add dinner for the band.'];\nreturn {\nband: r.band, initials: r.initials, when: r.when, thread: thread,\nlogoStyle: 'width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; background: ' + r.color + '; color: #130F1C; font-family: Space Grotesk, sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-conten n style=\"font-size: 11px; color: #ADA3C2\">When<\/span><span style=\"font-size: 14px; font-weight: 600\">{{c.when}}<\/span><\/div>\n<div style=\"background: #130F1C; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 11px; color: #ADA3C2\">Offer<\/span><span style=\"font-size: 14px; font-weight: 600\">{{c.offer}}<\/span><\/div>\n<\/div>\n<span style=\"font-size: 13px; color: #D3CCE3\">Provides: {{c.provides}}<\/span>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4; color: #F1ECFA; background: #130F1C; border-radius: 4px 12px 12px 12px; padding: 10px 12px\">{{c.message}}<\/p>\n\n<sc-if value=\"{{c.isNew}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<sc-if value=\"{{c.countering}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; align-items: center; gap: 8px; background: #130F1C; border-radius: 12px; padding: 6px 8px 6px 14px\">\n<span style=\"flex: 1; font-size: 14px; color: #D3CCE3\">Counter guarantee<\/span>\n<button type=\"button\" aria-label=\"Lower counter offer\" onClick=\"{{c.cMinus}}\" style=\"width: 44px; height: 44px; border-radius: 22px; background: #282038; border: 0; color: #F1ECFA; font: 600 20px Inter, sans-serif; cursor: pointer\">−<\/button>\n<span aria-live=\"polite\" style=\"width: 64px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600\">{{c.counter}}<\/span>\n<button type=\"button\" aria-label=\"Raise counter offer\" onClick=\"{{c.cPlus}}\" style=\"width: 44px; height: 44px; border-radius: 22px; background: #282038; border: 0; color: #F1ECFA; font: 600 20px Inter, sans-serif; cursor: pointer\">+<\/button>\n<\/div>\n<label for=\"{{c.noteId}}\" style=\"font-size: 13px; font-weight: 600; color: #D3CCE3\">Message to {{c.bookerFirst}} <span style=\"font-weight: 400; color: #ADA3C2\">(optional)<\/span><\/label>\n<textarea id=\"{{c.noteId}}\" rows=\"3\" value=\"{{c.note}}\" onChange=\"{{c.onNote}}\" placeholder=\"Explain your counter. Keep it friendly and short.\" style=\"border-radius: 12px; background: #130F1C; border: 1px solid #3D3354; color: #F1ECFA; padding: 10px 12px; font: 14px/1.4 Inter, sans-serif; outline: none; resize: none\"><\/textarea>\n<div style=\"display: flex; justify-content: space-between; margin-top: -4px\"><span style=\"font-size: 12px; color: #ADA3C2\">Tap to add a line:<\/span><span style=\"font-size: 12px; color: #ADA3C2\">{{c.noteCount}}<\/span><\/div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<sc-for list=\"{{c.phrases}}\" as=\"ph\" hint-placeholder-count=\"3\">\n<button type=\"button\" onClick=\"{{ph.add}}\" style=\"min-height: 36px; padding: 6px 12px; border-radius: 18px; background: transparent; border: 1px dashed #5E5478; color: #F1ECFA; font: 500 12px Inter, sans-serif; text-align: left; cursor: pointer\">+ {{ph.label}}<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"display: grid; grid-template-columns: 1fr 2fr; gap: 8px\">\n<button type=\"button\" onClick=\"{{c.cancelCounter}}\" style=\"min-height: 48px; border-radius: 12px; background: transparent; border: 1px solid #3D3354; color: #F1ECFA; font: 600 14px Inter, sans-serif; cursor: pointer\">Cancel<\/button>\n<button type=\"button\" onClick=\"{{c.sendCounter}}\" style=\"min-height: 48px; border-radius: 12px; background: #C69BFF; border: 0; color: #130F1C; font: 600 15px Inter, sans-serif; cursor: pointer\">{{c.sendLabel}}<\/button>\n<\/div>\n<\/sc-if>\n<sc-if value=\"{{c.accepting}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; background: #130F1C; border-radius: 14px; padding: 14px\">\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<span style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 15px; font-weight: 600\">Request a deposit<\/span><span style=\"font-size: 12px; color: #ADA3C2\">Holds the date. Paid to your band’s Square.<\/span><\/span>\n<button type=\"button\" role=\"switch\" aria-checked=\"{{c.depChecked}}\" aria-label=\"Request a deposit\" onClick=\"{{c.toggleDep}}\" style=\"{{c.depSwitch}}\"><span style=\"width: 26px; height: 26px; border-radius: 13px; background: #F1ECFA; display: block\"><\/span><\/button>\n<\/div>\n<sc-if value=\"{{c.depOn}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-size: 13px; font-weight: 600; color: #D3CCE3\">Amount<\/span>\n<div role=\"radiogroup\" aria-label=\"Deposit amount\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px\">\n<sc-for list=\"{{c.pcts}}\" as=\"o\" hint-placeholder-count=\"3\">\n<button type=\"button\" role=\"radio\" aria-checked=\"{{o.checked}}\" onClick=\"{{o.pick}}\" style=\"{{o.style}}\"><span style=\"display: block; font-size: 14px; font-weight: 700\">{{o.label}}<\/span><span style=\"display: block; font-size: 11px; opacity: 0.8\">{{o.sub}}<\/span><\/button>\n<\/sc-for>\n<\/div>\n<span style=\"font-size: 13px; font-weight: 600; color: #D3CCE3\">Due<\/span>\n<div role=\"radiogroup\" aria-label=\"Deposit due\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px\">\n<sc-for list=\"{{c.dues}}\" as=\"o\" hint-placeholder-count=\"3\">\n<button type=\"button\" role=\"radio\" aria-checked=\"{{o.checked}}\" onClick=\"{{o.pick}}\" style=\"{{o.style}}\">{{o.label}}<\/button>\n<\/sc-for>\n<\/div>\n<span style=\"font-size: 13px; font-weight: 600; color: #D3CCE3\">If the show is cancelled<\/span>\n<div role=\"radiogroup\" aria-label=\"Cancellation terms\" style=\"display: flex; flex-direction: column; gap: 6px\">\n<sc-for list=\"{{c.terms}}\" as=\"o\" hint-placeholder-count=\"3\">\n<button type=\"button\" role=\"radio\" aria-checked=\"{{o.checked}}\" onClick=\"{{o.pick}}\" style=\"{{o.styleWide}}\">{{o.label}}<\/button>\n<\/sc-for>\n<\/div>\n<\/div>\n<\/sc-if>\n<div style=\"display: grid; grid-template-columns: 1fr 2fr; gap: 8px\">\n<button type=\"button\" onClick=\"{{c.cancelAccept}}\" style=\"min-height: 48px; border-radius: 12px; background: transparent; border: 1px solid #3D3354; color: #F1ECFA; font: 600 14px Inter, sans-serif; cursor: pointer\">Back<\/button>\n<button type=\"button\" onClick=\"{{c.confirmAccept}}\" style=\"min-height: 48px; border-radius: 12px; background: #C69BFF; border: 0; color: #130F1C; font: 600 15px Inter, sans-serif; cursor: pointer\">{{c.confirmLabel}}<\/button>\n<\/div>\n<\/div>\n<\/sc-if>\n<sc-if value=\"{{c.showButtons}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px\">\n<button type=\"button\" onClick=\"{{c.accept}}\" style=\"min-height: 48px; border-radius: 12px; background: #C69BFF; border: 0; color: #130F1C; font: 600 15px Inter, sans-serif; cursor: pointer\">Accept<\/button>\n<button type=\"button\" onClick=\"{{c.startCounter}}\" style=\"min-height: 48px; border-radius: 12px; background: transparent; border: 1px solid #3D3354; color: #F1ECFA; font: 600 14px Inter, sans-serif; cursor: pointer\">Counter<\/button>\n<button type=\"button\" onClick=\"{{c.decline}}\" style=\"min-height: 48px; border-radius: 12px; background: transparent; border: 1px solid #5A3A2A; color: #F2B880; font: 600 14px Inter, sans-serif; cursor: pointer\">Decline<\/button>\n<\/div>\n<\/sc-if>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{c.isDone}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"status\" style=\"{{c.doneStyle}}\">{{c.doneLabel}}<\/div>\n<sc-if value=\"{{c.hasDeposit}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"background: #130F1C; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n<span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #C69BFF\">Deposit<\/span>\n<span style=\"{{c.depBadgeStyle}}\">{{c.depBadge}}<\/span>\n<\/div>\n<span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600\">{{c.depAmount}}<\/span>\n<span style=\"font-size: 13px; color: #ADA3C2\">{{c.depLine}}<\/span>\n<sc-if value=\"{{c.paidCash}}\" hint-placeholder-val=\"{{false}}\">\n<a href=\"PaymentCheck.dc.html\" style=\"min-height: 44px; border-radius: 10px; background: #261C3A; border: 1px solid #5A3F8A; color: #C69BFF; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center\">Quick check-in: how did it go?<\/a>\n<\/sc-if>\n<sc-if value=\"{{c.depPending}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n<button type=\"button\" onClick=\"{{c.remind}}\" style=\"{{c.remindStyle}}\">{{c.remindLabel}}<\/button>\n<button type=\"button\" onClick=\"{{c.markPaid}}\" style=\"min-height: 44px; border-radius: 10px; background: transparent; border: 1px solid #3D3354; color: #F1ECFA; font: 600 13px Inter, sans-serif; cursor: pointer\">Got it in cash<\/button>\n<\/div>\n<\/sc-if>\n<\/div>\n<\/sc-if>\n<sc-if value=\"{{c.isAccepted}}\" hint-placeholder-val=\"{{false}}\">\n<a href=\"Rider.dc.html\" style=\"min-height: 44px; border-radius: 12px; border: 1px solid #3D3354; color: #F1ECFA; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center\">View or edit the rider<\/a>\n<\/sc-if>\n<sc-if value=\"{{c.showSentNote}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 4px; align-self: flex-end; max-width: 90%\">\n<span style=\"font-size: 11px; color: #ADA3C2; text-align: right\">You wrote<\/span>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.4; color: #130F1C; background: #C69BFF; border-radius: 12px 4px 12px 12px; padding: 10px 12px\">{{c.sentNote}}<\/p>\n<\/div>\n<\/sc-if>\n<\/sc-if>\n<\/article>\n<\/sc-for>\n<sc-if value=\"{{empty}}\" hint-placeholder-val=\"{{false}}\">\n<p style=\"margin: 32px 0; text-align: center; font-size: 14px; color: #ADA3C2\">{{emptyText}}<\/p>\n<\/sc-if>\n\n<section aria-label=\"Booking preferences\" style=\"background: #1E182C; border: 1px solid #2E2642; border-radius: 16px; display: flex; flex-direction: column; margin-top: 4px\">\n<div style=\"display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #2E2642\">\n<span style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; font-weight: 600\">Accept requests from bookers<\/span><span style=\"font-size: 12px; color: #ADA3C2\">Shows “Request to book” on your band page<\/span><\/span>\n<button type=\"button\" role=\"switch\" aria-checked=\"{{openChecked}}\" aria-label=\"Accept requests from bookers\" onClick=\"{{toggleOpen}}\" style=\"{{openSwitch}}\"><span style=\"width: 26px; height: 26px; border-radius: 13px; background: #F1ECFA; display: block\"><\/span><\/button>\n<\/div>\n<div style=\"display: flex; align-items: center; justify-content: space-between; padding: 14px 16px\"><span style=\"font-size: 14px\">Minimum guarantee<\/span><span style=\"font-size: 14px; font-weight: 600\">$300<\/span><\/div>\n<\/section>\n<\/main>\n<\/div>", "script": "class Component extends DCLogic {\nconstructor(props) {\nsuper(props);\nthis.state = {\ntab: 'new',\nopen: true,\nstatus: { r1: 'new', r2: 'new', r3: 'new' },\ncountering: null,\naccepting: null,\nw9sent: false,\ndep: {},\ndepDraft: { on: true, pct: '25', due: '14', terms: 'keep14' },\ncounter: { r1: 600, r2: 900, r3: 1400 },\nnotes: {}\n};\n}\nrenderVals() {\nvar self = this;\nfunction mapPref() { try { return window.sessionStorage.getItem('fp_maps') || 'google'; } catch (e) { return 'google'; } }\nvar mapName = { google: 'Google Maps', apple: 'Apple Maps', waze: 'Waze' };\nfunction mapUrl(q, dir, app) { app = app || mapPref(); var e = encodeURIComponent(q);\nif (app === 'apple') return 'https://maps.apple.com/?' + (dir ? 'daddr=' : 'q=') + e;\nif (app === 'waze') return 'https://waze.com/ul?q=' + e + (dir ? '&navigate=yes' : '');\nreturn dir ? 'https://www.google.com/maps/dir/?api=1&destination=' + e : 'https://www.google.com/maps/search/?api=1&query=' + e; }\n\nvar st = this.state;\nvar reqs = [\n{ id: 'r1', kind: 'Headline · 60 min', venue: 'The Anchor Room', addr: '41 Market St, Portsmouth, NH', booker: 'Priya S., talent buyer', when: 'Sat, Jan 16 · 9:30 PM', offer: '$500 + 70% door', pay: 500, provides: 'sound engineer, drum kit', message: 'Loved the Riverside bill. We’d like you to headline our winter series.', free: 'Everyone free', ok: true },\n{ id: 'r2', kind: 'Festival · 45 min', venue: 'Harborfest 2027', addr: 'Prescott Park, Portsmouth, NH', booker: 'Dan W., festival booker', when: 'Sat, Jun 12 · 3:00 PM', offer: '$800 flat', pay: 800, provides: 'full stage, sound, meals', message: 'Day stage, mid-afternoon slot. Two other indie acts on the bill.', free: 'Everyone free', ok: true },\n{ id: 'r3', kind: 'Private event · 90 min', venue: 'Company holiday party', addr: 'Exeter Inn, 90 Front St, Exeter, NH', booker: 'Kim L., event planner', when: 'Fri, Dec 18 · 7:00 PM', offer: '$1,200 flat', pay: 1200, provides: 'PA system', message: 'Mostly covers are fine. About 120 guests.', free: 'Jo is busy', ok: false }\n];\nfunction money(n) { return '$' + n.toLocaleString('en-US'); }\nfunction depAmt(pay, p) { return p === 'flat' ? 100 : Math.round(pay * Number(p) / 100); }\nfunction seg(on) { return 'min-height: 44px; border-radius: 10px; font: 600 13px Inter, sans-serif; cursor: pointer; ' + (on ? 'background: #C69BFF; color: #130F1C; border: 1px solid #C69BFF' : 'background: transparent; color: #D3CCE3; border: 1px solid #3D3354'); }\nvar dueText = { '7': 'within 7 days', '14': 'within 14 days', 'show': '30 days before the show' };\nvar termText = { keep14: 'non-refundable within 14 days of the show', refund: 'refunded if the venue [2];\nreturn {\nlabel: d[1],\nselected: on ? 'true' : 'false',\nunread: String(unread),\nhasUnread: unread > 0,\npick: function () { self.setState({ channel: d[0], draft: '' }); },\nstyle: 'flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 18px; font: 600 13px Inter, sans-serif; cursor: pointer; display: flex; align-items: center; gap: 6px; ' +\n(on ? 'background: #F1ECFA; color: #130F1C; border: 1px solid #F1ECFA' : 'background: transparent; color: #D3CCE3; border: 1px solid #3D3354')\n};\n});\nvar list = this.state.threads[ch] || [];\nvar messages = list.map(function (m) {\nvar mine = m.who === 'You';\nreturn {\ntext: m.text, time: m.time, who: m.who, mine: mine, theirs: !mine, initial: m.who.charAt(0),\nisGif: !!m.gif, isText: !m.gif && !m.set, isSet: !!m.set, setTitle: m.set ? m.set.title : '', setSub: m.set ? m.set.sub : '', setSongs: m.set ? m.set.songs.map(function (t, i) { return { n: String(i + 1), t: t }; }) : [], gifLabel: 'GIF: ' + m.text,\ngifStyle: 'width: 180px; height: 120px; border-radius: 14px; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; background: ' + (m.gif || '#282038'),\navatarStyle: 'width: 32px; height: 32px; border-radius: 16px; flex-shrink: 0; background: ' + (avatar[m.who] || '#8EC5FC') + '; color: #130F1C; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center'\n};\n});\nvar pins = { general: 'Riverside Hall: load-in 6:30, set 9:30. Bring the in-ear packs.', setlists: 'Set length for Riverside: 50 minutes.', gear: 'Gear list lives in the shared folder.', dm: 'Direct message with Maya' };\nvar placeholders = { general: 'Message #general', setlists: 'Message #setlists', gear: 'Message #gear', dm: 'Message Maya' };\nvar gifOpen = this.state.gifOpen;\nvar q = this.state.gifQuery;\nvar palette = ['#3E2F4F', '#2B3A4A', '#8A4B1F', '#2F3E3A', '#4A3A33', '#33384A'];\nvar tagList = ['Rock on', 'Applause', 'Mic drop', 'Let’s go', 'Drum fill'];\nvar gifTags = tagList.map(function (t) {\nvar on = q === t;\nreturn {\nlabel: t,\npick: function () { self.setState({ gifQuery: t }); },\nstyle: 'flex-shrink: 0; min-height: 32px; padding: 0 12px; border-radius: 16px; font: 600 12px Inter, sans-serif; cursor: pointer; ' + (on ? 'background: #F1ECFA; color: #130F1C; border: 1px solid #F1ECFA' : 'background: transparent; color: #D3CCE3; border: 1px solid #3D3354')\n};\n});\nvar term = q || 'Trending';\nvar gifs = palette.map(function (c, i) {\nvar name = term + ' ' + (i + 1);\nreturn {\nname: name,\nlabel: 'Send GIF ' + name,\nstyle: 'aspect-ratio: 1; border-radius: 10px; border: 0; padding: 5px; cursor: pointer; display: flex; align-items: flex-end; background: ' + c,\nsend: function () {\nvar threads = Object.assign({}, self.state.threads);\nthreads[ch] = (threads[ch] || []).concat([{ who: 'You', text: name, time: 'Now', gif: c }]);\nself.setState({ threads: threads, gifOpen: false, gifQuery: '' });\n}\n};\n});\nreturn {\ngifOpen: gifOpen,\ngifQuery: q,\ngifTags: gifTags,\ngifs: gifs,\ngifPressed: gifOpen ? 'true' : 'false',\ntoggleGif: function () { self.setState({ gifOpen: !self.state.gifOpen }); },\nonGifQuery: function (e) { self.setState({ gifQuery: e.target.value }); },\ngifBtnStyle: 'width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; cursor: pointer; font: 700 12px Inter, sans-serif; letter-spacing: 0.04em; ' + (gifOpen ? 'background: #F1ECFA; color: #130F1C; border: 0' : 'background: transparent; color: #D3CCE3; border: 1px solid #3D3354'),\nchannels: channels,\nmessages: messages,\nempty: messages.length === 0,\npinned: pins[ch],\nplaceholder: placeholders[ch],\ndraft: this.state.draft,\nonDraft: function (e) { self.setState({ draft: e.target.value }); },\nsend: function (e) {\nif (e && e.preventDefault) e.preventDefault();\nvar t = (self.state.draft || '').trim();\nif (!t) return;\nvar threads = Object.assign({}, self.state.threads);\nthreads[ch] = (threads[ch] || []).concat([{ who: 'You', text: t, time: 'Now' }]);\nself.setState({ threads: threads, draft: '' });\n}\n};\n}\n}", "title": "Fame Plan — Member chat"}, "Chats.dc.html": {"markup": "<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #130F1C; color: #F1ECFA; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden\">\n\n<sc-if value=\"{{onIndex}}\" hint-placeholder-val=\"{{true}}\">\n<header style=\"padding: 56px 20px 10px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; margin-left: -4px\">\n<div style=\"display: flex; align-items: center; gap: 8px\">\n<a href=\"Menu.dc.html\" aria-label=\"Menu\" style=\"width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; background: #1E182C; border: 1px solid #2E2642; color: #F1ECFA; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M4 7h16M4 12h16M4 17h16\"><\/path><\/svg><\/a>\n<a href=\"Main.dc.html\" data-back=\"1\" aria-label=\"Back to previous page\" style=\"width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; background: #1E182C; border: 1px solid #2E2642; color: #F1ECFA; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 6-6 6 6 6\"><\/path><\/svg><\/a>\n<\/div>\n<a href=\"Settings.dc.html\" aria-label=\"Settings\" style=\"width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; background: #1E182C; border: 1px solid #2E2642; color: #F1ECFA; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"20\" height=\"2 ', sans-serif\">Where the money comes from<\/h2>\n<sc-for list=\"{{sources}}\" as=\"s\" hint-placeholder-count=\"5\">\n<div style=\"display: flex; flex-direction: column; gap: 5px\">\n<div style=\"display: flex; justify-content: space-between; font-size: 14px\"><span>{{s.label}}<\/span><span><b>{{s.amount}}<\/b> <span style=\"color: #ADA3C2\">· {{s.pct}}<\/span><\/span><\/div>\n<div style=\"height: 8px; border-radius: 4px; background: #2E2642; overflow: hidden\"><div style=\"{{s.bar}}\"><\/div><\/div>\n<\/div>\n<\/sc-for>\n<\/section>\n\n<section aria-label=\"Top venues\" style=\"display: flex; flex-direction: column; gap: 8px\">\n<h2 style=\"margin: 0; font: 600 18px 'Space Grotesk', sans-serif\">Top-paying venues<\/h2>\n<div style=\"background: #1E182C; border: 1px solid #2E2642; border-radius: 14px; display: flex; flex-direction: column\">\n<div style=\"display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #2E2642\"><span style=\"font: 700 15px 'Space Grotesk', sans-serif; color: #C69BFF; width: 18px\">1<\/span><span style=\"flex: 1; display: flex; flex-direction: column\"><span style=\"font-size: 14px; font-weight: 500\">Mill Street Tavern<\/span><span style=\"font-size: 12px; color: #ADA3C2\">3 shows · $600 average<\/span><\/span><span style=\"font-size: 14px; font-weight: 600\">$1,800<\/span><\/div>\n<div style=\"display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #2E2642\"><span style=\"font: 700 15px 'Space Grotesk', sans-serif; color: #C69BFF; width: 18px\">2<\/span><span style=\"flex: 1; display: flex; flex-direction: column\"><span style=\"font-size: 14px; font-weight: 500\">Riverside Hall<\/span><span style=\"font-size: 12px; color: #ADA3C2\">2 shows · $600 average<\/span><\/span><span style=\"font-size: 14px; font-weight: 600\">$1,200<\/span><\/div>\n<div style=\"display: flex; align-items: center; gap: 12px; padding: 12px 14px\"><span style=\"font: 700 15px 'Space Grotesk', sans-serif; color: #C69BFF; width: 18px\">3<\/span><span style=\"flex: 1; display: flex; flex-direction: column\"><span style=\"font-size: 14px; font-weight: 500\">The Lantern<\/span><span style=\"font-size: 12px; color: #ADA3C2\">2 shows · $475 average<\/span><\/span><span style=\"font-size: 14px; font-weight: 600\">$950<\/span><\/div>\n<\/div>\n<\/section>\n\n<section aria-label=\"Paid to members\" style=\"display: flex; flex-direction: column; gap: 8px\">\n<h2 style=\"margin: 0; font: 600 18px 'Space Grotesk', sans-serif\">Paid to members this year<\/h2>\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px\">\n<sc-for list=\"{{memberPay}}\" as=\"m\" hint-placeholder-count=\"4\">\n<div style=\"background: #1E182C; border: 1px solid #2E2642; border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px\"><span style=\"{{m.avatar}}\">{{m.i}}<\/span><span style=\"font-size: 12px; color: #D3CCE3\">{{m.name}}<\/span><span style=\"font: 600 14px 'Space Grotesk', sans-serif\">{{m.amount}}<\/span><\/div>\n<\/sc-for>\n<\/div>\n<span style=\"font-size: 12px; color: #9187A8\">Split by the agreed shares in Band admin. Total paid out: $3,760.<\/span>\n<\/section>\n<\/div>\n<\/sc-if>\n<\/main>\n<\/div>", "script": "class Component extends DCLogic {\nconstructor(props) {\nsuper(props);\nfunction takeIntent(k) { try { if (window.sessionStorage.getItem('fp_intent') === k) { window.sessionStorage.removeItem('fp_intent'); return true; } } catch (e) {} return false; }\nvar wantAdd = takeIntent('expense');\nif (wantAdd) setTimeout(function () { var el = document.getElementById('ex-what'); if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); } }, 60);\nthis.state = {\ntab: 'exp', month: 'nov', adding: wantAdd, newWhat: '', newAmt: 40, newCat: 'Gas and travel', newWho: 'Dev', addError: false, table: false, sel: 5,\nitems: {\nnov: [\n['10', 'Tolls on the way to Portland', 'Gas and travel', 'Dev', 40],\n['9', 'Instagram ads for “Northbound”', 'Marketing', 'Maya', 70],\n['7', 'Gas, Mill Street Tavern', 'Gas and travel', 'Dev', 60],\n['7', 'Parking', 'Gas and travel', 'Dev', 20],\n['7', 'Post-show food', 'Food', 'Maya', 45],\n['5', 'Shirt reorder (50)', 'Merch', 'Sam', 180],\n['3', 'Strings and sticks', 'Gear and repairs', 'Jo', 85],\n['1', 'Rehearsal space', 'Rehearsal space', 'Sam', 150]\n],\noct: [\n['24', 'Mixing, “Northbound”', 'Recording', 'Band fund', 300],\n['18', 'Gas, two out-of-town shows', 'Gas and travel', 'Dev', 160],\n['12', 'Poster printing', 'Marketing', 'Maya', 60],\n['9', 'New snare head', 'Gear and repairs', 'Jo', 40],\n['1', 'Rehearsal space', 'Rehearsal space', 'Sam', 150]\n],\nsep: [\n['27', 'Gas and a hotel night', 'Gas and travel', 'Dev', 210],\n['20', 'Amp repair', 'Gear and repairs', 'Dev', 120],\n['14', 'Photo shoot', 'Marketing', 'Band fund', 150],\n['14', 'Lunch at the shoot', 'Food', 'Maya', 60],\n['1', 'Rehearsal space', 'Rehearsal space', 'Sam', 150]\n]\n}\n};\n}\nrenderVals() {\nvar self = this;\nvar st = this.state;\nfunction money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }\nfunction seg(on) { return 'min-height: 40px; border-radius: 10px; border: 0; font: 600 14px Inter, sans-serif; cursor: pointer; ' + (on ? 'background: #F1ECFA; color: #130F1C' : 'background: transparent; color: #D3CCE3'); }\nfunction chip(on) { return 'min-height: 40px; padding: 0 12px; border-radius: 20px; font: 600 13px Inter, sans-serif; cursor: pointer; ' + (on ? 'background: #C69BFF; color: #130F1C; border: 1px solid #C69BFF' : 'background: transparent; color: #D3CCE3; border: 1px solid #3D3354'); }\nvar tabs = [['exp', 'Expenses'], ['stats', 'Stats']].map(function (t) { var on = st.tab === t[0]; return { label: t[1], selected: on ? 'true' : 'false', style: seg(on), pick: function () { self.setState({ tab: t[0] }); } }; });\nvar monthNames = { sep: 'September', oct: 'October', nov: 'November' };\nvar monShort = { sep: 'SEP', oct: 'OCT', nov: 'NOV' };\nvar months = [['sep', 'Sep'], ['oct', 'Oct'], ['nov', 'Nov']].map(function (m) { var on = st.month === m[0]; return { label: m[1], checked: on ? 'true' : 'false', style: chip(on) + '; flex: 1', pick: function () { self.setState({ month: m[0], adding: false }); } }; });\nvar list = st.items[st.month];\nvar spent = list.reduce(function (a, i) { return a + i[4]; }, 0);\nvar budget = 800;\nvar pct = Math.min(Math.round(spent / budget * 100), 100);\nvar over = spent > budget;\nvar catNames = ['Rehearsal space', 'Gas and travel', 'Gear and repairs', 'Merch', 'Recording', 'Marketing', 'Food'];\nvar totals = {};\nlist.forEach(function (i) { totals[i[2]] = (totals[i[2]] || 0) + i[4]; });\nvar maxCat = Math.max.apply(null, catNames.map(function (c) { return totals[c] || 0; }).concat([1]));\nvar cats = catNames.filter(function (c) { return totals[c]; }).sort(function (a, b) { return totals[b] - totals[a]; }).map(function (c) {\nreturn { label: c, amount: money(totals[c]), bar: 'height: 8px; border-radius: 4px; background: #A274EC; width: ' + Math.round(totals[c] / maxCat * 100) + '%' };\n});\nvar items = list.map(function (i, idx) {\nreturn { mon: monShort[st.month], day: i[0], what: i[1], meta: i[2] + ' · paid by ' + i[3], amount: money(i[4]), rowStyle: 'display: flex; align-items: center; gap: 10px; padding: 10px 14px' + (idx < list.length - 1 ? '; border-bottom: 1px solid #2E2642' : '') };\n});\nvar catPicks = catNames.map(function (c) { var on = st.newCat === c; return { label: c, checked: on ? 'true' : 'false', style: chip(on), pick: function () { self.setState({ newCat: c }); } }; });\nvar payers = ['Maya', 'Dev', 'Sam', 'Jo', 'Fund'].map(function (p) { var on = st.newWho === p; return { label: p, checked: on ? 'true' : 'false', style: chip(on) + '; padding: 0 4px', pick: function () { self.setState({ newWho: p }); } }; });\n// stats\nvar data = [['Jun', 1180, 640], ['Jul', 1650, 720], ['Aug', 1420, 980], ['Sep', 1310, 690], ['Oct', 1980, 710], ['Nov', 1630, 650]];\nvar maxV = 2000, H = 150;\nvar chart = data.map(function (d, i) {\nvar on = st.sel === i;\nfunction bar(v, color) { return 'width: 11px; height: ' + Math.round(v / maxV * H) + 'px; background: ' + color + '; border-radius: 4px 4px 0 0; display: block; opacity: ' + (on ? '1' : '0.75'); }\nreturn {\nlabel: d[0], aria: d[0] + ': income ' + money(d[1]) + ', expenses ' + money(d[2]), pressed: on ? 'true' : 'false',\npick: function () { self.setState({ sel: i }); },\ncolStyle: 'flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; background: ' + (on ? '#261C3A' : 'transparent') + '; border: 0; border-radius: 6px 6px 0 0; padding: 0; cursor: pointer',\ninc: bar(d[1], '#A274EC'), exp: bar(d[2], '#CC7C34'),\nlabelStyle: 'flex: 1; text-align: center; font-size: 11px; color: ' + (on ? '#F1ECFA' : '#9187A8') + '; font-weight: ' + (on ? '700' : '500'),\nincTxt: money(d[1]), expTxt: money(d[2]), profitTxt: money(d[1] - d[2])\n};\n});\nvar s = data[st.sel];\nvar inc = data.reduce(function (a, d) { return a + d[1]; }, 0), exp = data.reduce(function (a, d) { return a + d[2]; }, 0);\nvar src = [['Shows', 5685], ['Merch', 1650], ['Streaming', 825], ['Bandcamp', 642], ['Other', 368]];\nvar sources = src.map(function (x) { return { label: x[0], amount: money(x[1]), pct: Math.round(x[1] / inc * 100) + '%', bar: 'height: 8px; border-radius: 4px; background: #A274EC; width: ' + Math.round(x[1] / src[0][1] * 100) + '%' }; });\nvar mp = [['M', 'Maya', 1128, '#F2B880'], ['D', 'Dev', 1128, '#8EC5FC'], ['S', 'Sam', 752, '#B5E3B0'], ['J', 'Jo', 752, '#D7B8F3']];\nvar memberPay = mp.map(function (m) { return { i: m[0], name: m[1], amount: money(m[2]), avatar: 'width: 30px; height: 30px; border-radius: 15px; background: ' + m[3] + '; color: #130F1C; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center' }; });\nreturn {\ntabs: tabs, onExp: st.tab === 'exp', onStats: st.tab === 'stats',\nmonths: months, monthName: monthNames[st.month],\nspent: money(spent), budget: money(budget),\nbudgetBar: 'height: 8px; border-radius: 4px; width: ' + pct + '%; background: ' + (over ? '#F2B880' : '#C69BFF'),\nbudgetNote: over ? money(spent - budget) + ' over budget' : money(budget - spent) + ' left this month',\nbudgetNoteStyle: 'font-size: 13px; font-weight: 600; color: ' + (over ? '#F2B880' : '#B5E3B0'),\ncats: cats, items: items,\nadding: st.adding,\ntoggleAdd: function () { self.setState({ adding: !self.state.adding, addError: false }); },\naddBtnLabel: st.adding ? 'Cancel' : '+ Add expense',\naddBtnStyle: 'min-height: 40px; padding: 0 12px; border-radius: 20px; font: 600 13px Inter, sans-serif; cursor: pointer; ' + (st.adding ? 'background: transparent; color: #D3CCE3; border: 1px solid #3D3354' : 'background: #C69BFF; color: #130F1C; border: 0'),\nnewWhat: st.newWhat, onWhat: function (e) { self.setState({ newWhat: e.target.value, addError: false }); },\nnewAmt: money(st.newAmt),\namtMinus: function () { self.setState({ newAmt: Math.max(5, self.state.newAmt - 5) }); },\namtPlus: function () { self.setState({ newAmt: self.state.newAmt + 5 }); },\ncatPicks: catPicks, payers: payers, addError: st.addError,\nsaveExpense: function () {\nvar w = (self.state.newWhat || '').trim();\nif (!w) { self.setState({ addError: true }); return; }\nvar all = Object.assign({}, self.state.items);\nvar day = self.state.month === 'nov' ? '11' : '28';\nall[self.state.month] = [[day, w, self.state.newCat, self.state.newWho === 'Fund' ? 'Band fund' : self.state.newWho, self.state.newAmt]].concat(all[self.state.month]);\nself.setState({ items: all, adding: false, newWhat: '', newAmt: 40 });\n},\ntiles: [\n{ label: 'Income', value: money(inc), sub: '14 shows, merch, streaming' },\n{ label: 'Expenses', value: money(exp), sub: money(exp / 6) + ' a month on average' },\n{ label: 'Profit', value: money(inc - exp), sub: Math.round((inc - exp) / inc * 100) + '% of income' },\n{ label: 'Average per show', valu /section>\n\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"display: flex; justify-content: space-between\"><label for=\"p-bio\" style=\"font-size: 13px; font-weight: 600; color: #D3CCE3\">About me<\/label><span style=\"font-size: 12px; color: #ADA3C2\">{{bioCount}}<\/span><\/div>\n<textarea id=\"p-bio\" value=\"{{bio}}\" onChange=\"{{onBio}}\" rows=\"3\" placeholder=\"Your background, influences, gear.\" style=\"border-radius: 12px; background: #1E182C; border: 1px solid #3D3354; color: #F1ECFA; padding: 12px 14px; font: 15px/1.4 Inter, sans-serif; outline: none; resize: none\"><\/textarea>\n<\/div>\n\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"p-home\" style=\"font-size: 13px; font-weight: 600; color: #D3CCE3\">Based in<\/label>\n<input id=\"p-home\" type=\"text\" value=\"Portland, ME\" style=\"height: 48px; border-radius: 12px; background: #1E182C; border: 1px solid #3D3354; color: #F1ECFA; padding: 0 14px; font: 16px Inter, sans-serif; outline: none\" readonly>\n<\/div>\n\n<fieldset style=\"border: 0; margin: 0; padding: 0\">\n<legend style=\"font-size: 13px; font-weight: 600; color: #D3CCE3; padding: 0; margin-bottom: 8px\">Open to<\/legend>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{openTo}}\" as=\"o\" hint-placeholder-count=\"4\">\n<button type=\"button\" aria-pressed=\"{{o.pressed}}\" onClick=\"{{o.toggle}}\" style=\"{{o.style}}\">{{o.label}}<\/button>\n<\/sc-for>\n<\/div>\n<\/fieldset>\n\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-size: 13px; font-weight: 600; color: #D3CCE3\">Contact · only your bands see this<\/span>\n<div style=\"background: #1E182C; border: 1px solid #3D3354; border-radius: 12px; display: flex; flex-direction: column\">\n<div style=\"display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid #2E2642\">\n<label for=\"p-email\" style=\"width: 72px; flex-shrink: 0; font-siz >\n<span style=\"flex: 1; font-size: 15px\">The Late Shift<\/span>\n<span style=\"font-size: 12px; color: #ADA3C2\">Admin<\/span>\n<\/div>\n<button type=\"button\" style=\"min-height: 48px; background: transparent; border: 0; color: #C69BFF; font: 600 14px Inter, sans-serif; text-align: left; padding: 0 14px; cursor: pointer\">+ Join a band with a code<\/button>\n<\/div>\n<\/section>\n<\/main>\n<\/div>", "script": "class Component extends DCLogic {\nconstructor(props) {\nsuper(props);\nthis.state = {\nname: 'Dev',\nbio: 'Guitar and harmonies. Grew up on 90s indie and old country records.',\ninst: { 'Guitar': true, 'Vocals': true },\nopen: { 'Session work': true },\nstand: { 'Guitar': ['left', 'front', 'inner'], 'Vocals': ['left', 'front', 'inner'] },\nphoto: 0,\ndiscover: true,\nsaved: true\n};\n}\nrenderVals() {\nvar self = this;\nvar st = this.state;\nfunction chip(on) {\nreturn 'min-height: 36px; padding: 0 14px; border-radius: 18px; font: 600 13px Inter, sans-serif; cursor: pointer; ' + (on ? 'background: #C69BFF; color: #130F1C; border: 1px solid #C69BFF' : 'background: transparent; color: #D3CCE3; border: 1px solid #3D3354');\n}\nfunction toggler(key, item) {\nreturn function () {\nvar m = Object.assign({}, self.state[key]);\nif (m[item]) delete m[item]; else m[item] = true;\nvar patch = { saved: false }; patch[key] = m;\nself.setState(patch);\n};\n}\nvar instList = ['Guitar', 'Vocals', 'Bass', 'Drums', 'Keys', 'Synth', 'Production', 'Strings'];\nvar instruments = instList.map(function (x) { var on = !!st.inst[x]; return { label: x, pressed: on ? 'true' : 'false', toggle: toggler('inst', x), style: chip(on) }; });\nvar openList = ['Session work', 'Joining a band', 'Co-writing', 'Teaching'];\nvar openTo = openList.map(function (x) { var on = !!st.open[x]; return { label: x, pressed: on ? 'true' : 'false', toggle: toggler('open', x), style: chip(on) }; });\nvar playing = instList.filter(function (x) { return st.inst[x]; });\nfunction seg(on) { return 'min-height: 40px; border-radius: 8px; border: 0; font: 600 13px Inter, sans-serif; cursor: pointer; ' + (on ? 'background: #F1ECFA; color: #130F1C' : 'background: transparent; color: #D3CCE3'); }\nvar stand = playing.map(function (inst) {\nvar cur = (st.stand && st.stand[inst]) || [inst === 'Drums' ? 'center' : 'center', inst === 'Drums' ? 'back' : 'front'];\nfunction set(i, v) { return function () { var m = Object.assign({}, self.state.stand); var c = (m[inst] || cur).slice(); c[i] = v; m[inst] = c; self.setState({ stand: m, saved: false }); }; }\nreturn {\ninst: inst, aria: inst + ': side of the stage', depthAria: inst + ': front or back', laneAria: inst + ': inner or outer',\nhasLane: cur[0] !== 'center',\nlanes: [['inner', 'Inner'], ['outer', 'Outer']].map(function (o) { var on = (cur[2] || 'inner') === o[0]; return { label: o[1], checked: on ? 'true' : 'false', style: seg(on), pick: set(2, o[0]) }; }),\nsides: [['left', 'Stage left'], ['center', 'Center'], ['right', 'Stage right']].map(function (o) { var on = cur[0] === o[0]; return { label: o[1], checked: on ? 'true' : 'false', style: seg(on), pick: set(0, o[0]) }; }),\ndepths: [['front', 'Front'], ['back', 'Back']].map(function (o) { var on = cur[1] === o[0]; return { label: o[1], checked: on ? 'true' : 'false', style: seg(on), pick: set(1, o[0]) }; })\n};\n});\nvar colors = ['#8EC5FC', '#F2B880', '#B5E3B0'];\nvar on = st.discover;\nreturn {\nstand: stand,\nnoInst: playing.length === 0,\nname: st.name,\nnameShown: st.name || 'Your name',\ninitial: (st.name || '?').charAt(0).toUpperCase(),\nheadline: playing.length ? playing.join(', ') : 'Add what you play',\nphotoStyle: 'width: 96px; height: 96px; border-radius: 48px; flex-shrink: 0; background: ' + colors[st.photo % colors.length] + '; color: #130F1C; font-family: Space Grotesk, sans-serif; font-size: 36px; font-weight: 700; display: flex; align-items: center; justify-content: center',\ncyclePhoto: function () { self.setState({ photo: self.state.photo + 1, saved: false }); },\nonName: function (e) { self.setState({ name: e.target.value, saved: false }); },\nbio: st.bio,\nbioCount: st.bio.length + ' / 200',\nonBio: function (e) { self.setState({ bio: e.target.value.slice(0, 200), saved: false }); },\ninstruments: instruments,\nopenTo: openTo,\ndiscoverChecked: on ? 'true' : 'false',\ndiscoverSub: on ? 'Bands and musicians can find you and send invites.' : 'Hidden. Only your bands can see your profile.',\ntoggleDiscover: function () { self.setState({ discover: !self.state.discover, saved: false }); },\ndiscoverSwitch: 'width: 52px; height: 32px; border-radius: 16px; border: 0; padding: 3px; cursor: pointer; flex-shrink: 0; display: flex; box-sizing: border-box; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (on ? '#C69BFF' : '#3D3354'),\nsave: function () { self.setState({ saved: true }); },\nsaveLabel: st.saved ? 'Saved' : 'Save',\nsaveStyle: 'min-height: 44px; padding: 0 18px; border-radius: 22px; font: 600 14px Inter, sans-serif; cursor: pointer; ' + (st.saved ? 'background: transparent; color: #B5E3B0; border: 1px solid #3E5A3B' : 'background: #C69BFF; color: #130F1C; border: 0')\n};\n}\n}", "title": "Fame Plan — My profile"}, "Releases.dc.html": {"markup": "<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #130F1C; color: #F1ECFA; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden\">\n<header style=\"padding: 48px 20px 8px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; align-items: center; gap: 6px\">\n<a href=\"Menu.dc.html\" aria-label=\"Menu\" style=\"width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; background: #1E182C; border: 1px solid #2E2642; color: #F1ECFA; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\" direction: column; gap: 6px\">\n<div style=\"display: flex; justify-content: space-between; font-size: 13px\"><span style=\"font-weight: 600\">{{doneLabel}}<\/span><span style=\"color: #ADA3C2\">{{pct}}<\/span><\/div>\n<div style=\"height: 8px; border-radius: 4px; background: #2E2642; overflow: hidden\"><div style=\"{{barStyle}}\"><\/div><\/div>\n<\/div>\n\n<section aria-label=\"Release checklist\" style=\"background: #1E182C; border: 1px solid #2E2642; border-radius: 16px; display: flex; flex-direction: column\">\n<sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"9\">\n<div style=\"{{s.wrapStyle}}\">\n<div style=\"display: flex; align-items: center; gap: 10px; padding: 12px 8px 12px 16px\">\n<button type=\"button\" role=\"checkbox\" aria-checked=\"{{s.checked}}\" aria-label=\"{{s.ariaLabel}}\" onClick=\"{{s.toggle}}\" style=\"width: 44px; height: 44px; margin: -8px 0 -8px -10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0\">\n<span style=\"{{s.boxStyle}}\">\n<sc-if value=\"{{s.done}}\" hint-placeholder-val=\"{{false}}\">\n<svg aria-hidden=\"true\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#130F1C\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5 9-10\"><\/path><\/svg>\n<\/sc-if>\n<\/span>\n<\/button>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n<span style=\"{{s.titleStyle}}\">{{s.title}}<\/span>\n<span style=\"font-size: 12px; color: #ADA3C2\">{{s.meta}}<\/span>\n<\/div>\n<sc-if value=\"{{s.next}}\" hint-placeholder-val=\"{{false}}\">\n<span style=\"font-size: 11px; font-weight: 700; color: #130F1C; background: #C69BFF; border-radius: 999px; padding: 4px 8px; flex-shrink: 0\">Next<\/span>\n<\/sc-if>\n<button type=\"button\" aria-label=\"{{s.commentLabel}}\" aria-expanded=\"{{s.expanded}}\" onClick=\"{{s.toggleThread}}\" style=\"{{s.commentBtnStyle}}\">\n<s   var initial = hashScreen() || START;
  go(initial, false);
  try { history.replaceState({ s: initial }, '', '#' + toHash(initial)); } catch (e) {}
})();
</script>
