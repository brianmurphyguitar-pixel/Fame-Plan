<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Fame Plan Admin</title>
<style>
:root { --bg:#130F1C; --card:#1E182C; --card2:#241D33; --line:#2E2642; --line2:#3D3354; --ink:#F1ECFA; --ink2:#D3CCE3; --mute:#ADA3C2; --faint:#9187A8; --accent:#C69BFF; --warn:#F2B880; --warnbg:#2E2216; --warnline:#6A4A28; --ok:#B5E3B0; --okbg:#1F2E22; --okline:#3E5A3B; --bad:#FFB3BD; --badbg:#3A1520; --badline:#7A2A38; --info:#8EC5FC; --s1:#9B6BE0; --s2:#1F9E8F; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: #130F1C; padding: 8px 12px; border-radius: 8px; z-index: 10; }
.skip:focus { left: 8px; }
header.top { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
header.top .brand { font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
header.top .brand span { color: var(--accent); }
.grow { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line2); color: var(--ink2); white-space: nowrap; }
.pill.ok { background: var(--okbg); color: var(--ok); border-color: var(--okline); }
.pill.warn { background: var(--warnbg); color: var(--warn); border-color: var(--warnline); }
.pill.bad { background: var(--badbg); color: var(--bad); border-color: var(--badline); }
.pill.accent { background: #261C3A; color: var(--accent); border-color: #5A3F8A; }
.muted { color: var(--mute); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 57px); }
nav.side { border-right: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 57px; height: calc(100vh - 57px); overflow-y: auto; }
nav.side button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; color: var(--ink2); text-align: left; font-weight: 600; }
nav.side button:hover { background: var(--card); }
nav.side button[aria-current="page"] { background: #261C3A; color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
nav.side .count { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--warn); }
nav.side .sep { height: 1px; background: var(--line); margin: 8px 4px; }
main#view { padding: 24px; min-width: 0; display: flex; flex-direction: column; gap: 20px; max-width: 1280px; }
h1.h { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
h2.h { margin: 0; font-size: 17px; }
.sub { margin: 4px 0 0; color: var(--mute); font-size: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 12px; }
.kpis { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.two { grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.kpi .v { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.kpi .k { font-size: 13px; color: var(--mute); }
.kpi .d { font-size: 12px; font-weight: 700; }
.up { color: var(--ok); } .down { color: var(--warn); }
.btn { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line2); background: transparent; color: var(--ink); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--card2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #130F1C; }
.btn.ok { background: var(--okbg); border-color: var(--okline); color: var(--ok); }
.btn.warn { background: var(--warnbg); border-color: var(--warnline); color: var(--warn); }
.btn.danger { background: var(--badbg); border-color: var(--badline); color: var(--bad); }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
input[type=text], input[type=search], input[type=number], select, textarea { background: var(--bg); border: 1px solid var(--line2); border-radius: 10px; min-height: 40px; padding: 0 10px; }
textarea { padding: 10px; min-height: 80px; width: 100%; resize: vertical; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 700; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--card2); }
tr[aria-selected="true"] td { background: #261C3A; }
.tablewrap { overflow-x: auto; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 16px; align-items: start; }
.blur { filter: blur(6px); user-select: none; }
.content { white-space: pre-wrap; word-break: break-word; font-size: 15px; }
.switch { width: 48px; height: 28px; border-radius: 14px; border: 0; padding: 3px; display: inline-flex; flex-shrink: 0; background: var(--line2); }

#signin { display: grid; place-items: center; min-height: 80vh; padding: 20px; }

// ======================================================= API (demo + live)
function demoApi(d) {
  const log = (what, target, note) => d.audit.unshift({ at: Date.now(), by: 'you (demo)', what, target, note: note || '' });
  return {
    mode: 'Demo data', role: 'admin', email: 'demo@fameplan',
    async load() { return d; },
    async modAction(id, action, note) { const it = d.queue.find((x) => x.id === id); Object.assign(it, { status: 'resolved', resolution: action, note }); log('Moderation: ' + action.replace(/_/g, ' '), it.label, note); },
    async userAction(uid, action, note) {
      const u = d.users.find((x) => x.uid === uid);
      const map = { warn: () => { u.warnings++; }, clear_warnings: () => { u.warnings = 0; u.pauses = 0; }, suspend_7d: () => { u.status = 'suspended'; }, terminate: () => { u.status = 'terminated'; }, restore: () => { u.status = 'active'; }, grant_pro: () => { u.plan = 'Pro'; }, make_moderator: () => { u.moderator = true; }, remove_moderator: () => { u.moderator = false; } };
      map[action](); log('Account: ' + action.replace(/_/g, ' '), u.name + ' (' + u.uid + ')', note);
    },
    async venueAction(id, action, note) { const v = d.venues.find((x) => x.id === id); v.status = action === 'verify' ? 'verified' : 'rejected'; log(action === 'verify' ? 'Verified venue' : 'Rejected venue claim', v.name, note); },
    async moneyAction(kind, id, action, note) {
      const list = kind === 'payout' ? d.payouts : d.disputes; const it = list.find((x) => x.id === id);
      it.status = { release: 'paid', hold: 'held', resolve_band: 'resolved', resolve_venue: 'resolved', split: 'resolved' }[action] || it.status; it.resolution = action;
      log((kind === 'payout' ? 'Payout: ' : 'Dispute: ') + action.replace(/_/g, ' '), it.band ? it.band + ' · ' + money(it.amount) : it.parties, note);
    },
    async setConfig(cfg, note) { d.config = cfg; log('Changed app settings', '', note); },
    async broadcast(msg) { log('Sent announcement to ' + msg.audience, msg.title, msg.note); }
  };
}

async function liveApi(cfg) {
  const V = '11.0.2';
  const [{ initializeApp }, A, F, FN] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),

          out.queue = rows(await F.getDocs(F.query(F.collection(db, 'modQueue'), F.orderBy('updatedAt', 'desc'), F.limit(200))));

          if (role === 'admin') {

            out.venues = rows(await F.getDocs(F.query(F.collection(db, 'venueClaims'), F.orderBy('submitted', 'desc'), F.limit(100))));
            out.payouts = rows(await F.getDocs(F.query(F.collection(db, 'payoutReviews'), F.orderBy('date', 'desc'), F.limit(100))));
            out.disputes = rows(await F.getDocs(F.query(F.collection(db, 'disputes'), F.where('status', '==', 'open'), F.limit(100))));

// ======================================================= CHARTS
const CW = 640, CH = 220, CP = { l: 48, r: 12, t: 14, b: 28 };
function niceMax(v, step) { return Math.max(step, Math.ceil(v / step) * step); }
function lineChart(points, label) {
  if (points.length < 2) return `<p class="muted small">${points.length ? fmtN(points[0].v) + ' active today. The chart fills in as days go by.' : 'No data yet.'}</p>`;
  const vals = points.map((p) => p.v), max = niceMax(Math.max(...vals), 250);
  const x = (i) => CP.l + (i / (points.length - 1)) * (CW - CP.l - CP.r), y = (v) => CP.t + (1 - v / max) * (CH - CP.t - CP.b);
  const path = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const xl = [0, 7, 14, 21, points.length - 1].map((i) => `<text x="${x(i)}" y="${CH - 8}" text-anchor="middle" font-size="11" fill="var(--faint)">${points[i].date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</text>`).join('');
  return `<div class="chart" style="position:relative">
  <svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(label)}. Latest ${fmtN(vals[vals.length - 1])}, highest ${fmtN(Math.max(...vals))}.">
    ${[0, max / 2, max].map((t) => `<line x1="${CP.l}" x2="${CW - CP.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${CP.l - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--faint)">${fmtN(t)}</text>`).join('')}
    <path d="${path}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(points.length - 1)}" cy="${y(vals[vals.length - 1])}" r="4" fill="var(--s1)" stroke="var(--card)" stroke-width="2"/>
    ${xl}
    <line class="xh" y1="${CP.t}" y2="${CH - CP.b}" stroke="var(--line2)" visibility="hidden"/>
    <circle class="xd" r="5" fill="var(--s1)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>
    <rect class="hit" x="${CP.l}" y="0" width="${CW - CP.l - CP.r}" height="${CH - CP.b}" fill="transparent"/>
  </svg><div class="tip" hidden></div></div>`;
}
function wireLine(el, points) {
  if (points.length < 2) return;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), hit = el.querySelector('.hit'), xh = el.querySelector('.xh'), xd = el.querySelector('.xd');
  const vals = points.map((p) => p.v), max = niceMax(Math.max(...vals), 250);
  hit.addEventListener('pointermove', (e) => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * (CW / r.width);
    const i = Math.max(0, Math.min(points.length - 1, Math.round(((sx - CP.l) / (CW - CP.l - CP.r)) * (points.length - 1))));
    const cx = CP.l + (i / (points.length - 1)) * (CW - CP.l - CP.r), cy = CP.t + (1 - vals[i] / max) * (CH - CP.t - CP.b);
    xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('visibility', 'visible'); xd.setAttribute('cx', cx); xd.setAttribute('cy', cy); xd.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.style.left = (cx / CW) * r.width + 'px'; tip.style.top = (cy / CH) * r.height + 'px';
    tip.textContent = points[i].date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' + fmtN(vals[i]) + ' active';
  });
  hit.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); xd.setAttribute('visibility', 'hidden'); });
}
function stackedBars(rows, keys, names, colors, label) {
  const tot = rows.map((r) => keys.reduce((s, k) => s + r[k], 0)), max = niceMax(Math.max(...tot), 200);
  const bw = (CW - CP.l - CP.r) / rows.length, barW = Math.min(44, bw * 0.55);
  const y = (v) => CP.t + (1 - v / max) * (CH - CP.t - CP.b);
  let marks = '';
  rows.forEach((r, i) => {
    let acc = 0; const cx = CP.l + bw * i + bw / 2, x0 = cx - barW / 2, x1 = cx + barW / 2;
    keys.forEach((k, j) => {
      const yb = y(acc) - (j ? 2 : 0), yt = y(acc + r[k]); acc += r[k];
      const top = j === keys.length - 1, rad = top ? Math.min(4, (yb - yt) / 2) : 0;
      const d = rad ? `M${x0} ${yb} V${yt + rad} Q${x0} ${yt} ${x0 + rad} ${yt} H${x1 - rad} Q${x1} ${yt} ${x1} ${yt + rad} V${yb} Z` : `M${x0} ${yb} V${yt} H${x1} V${yb} Z`;
      marks += `<path d="${d}" fill="${colors[j]}" data-tip="${esc(r.m + ' · ' + names[j] + ' ' + money(r[k]) + ' · total ' + money(tot[i]))}"/>`;
    });
    marks += `<rect x="${cx - bw / 2}" y="0" width="${bw}" height="${CH - CP.b}" fill="transparent" data-hit="${i}"/>`;
    marks += `<text x="${cx}" y="${CH - 8}" text-anchor="middle" font-size="11" fill="var(--faint)">${r.m}</text>`;
    if (i === rows.length - 1) marks += `<text x="${cx}" y="${y(tot[i]) - 6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${money(tot[i])}</text>`;
  });
  const grid = [0, max / 2, max].map((t) => `<line x1="${CP.l}" x2="${CW - CP.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${CP.l - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--faint)">${money(t)}</text>`).join('');
  return `<div class="legend">${names.map((n, j) => `<span><i style="background:${colors[j]}" aria-hidden="true"></i>${n}</span>`).join('')}</div>
  <div class="chart" style="position:relative"><svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(label)}">${grid}${marks}</svg><div class="tip" hidden></div></div>`;
}
function wireBars(el, rows) {
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  svg.querySelectorAll('[data-hit]').forEach((h) => {
    const i = +h.dataset.hit, r = rows[i];
    h.addEventListener('pointerenter', () => {
      const sr = svg.getBoundingClientRect(), b = h.getBoundingClientRect();
      tip.hidden = false; tip.textContent = `${r.m}: Pro ${money(r.pro)} · Ads ${money(r.ads)} · Total ${money(r.pro + r.ads)}`;
      tip.style.left = (b.left - sr.left + b.width / 2) + 'px'; tip.style.top = '24px';
    });
    h.addEventListener('pointerleave', () => { tip.hidden = true; });
  });
}

  const stPill = (s) => `<span class="pill ${s === 'active' ? 'ok' : s === 'review' ? 'warn' : 'bad'}">${esc(s)}</span>`;
  return `<div><h1 class="h">People</h1><p class="sub">Find any account. See their standing, give Pro, suspend or restore.</p></div>
  <div class="row"><input type="search" id="f-q" aria-label="Search people" placeholder="Search name, email, band or ID" value="${esc(filters.userQ)}" style="flex:1;min-width:200px">
    <label class="small muted">Role <select id="f-role"><option value="">All</option>${roles.map((r) => `<option ${filters.userRole === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></label></div>
  <div class="split">
    <div class="card" style="padding:0"><div class="tablewrap"><table><thead><tr><th>Name</th><th>Role</th><th>Plan</th><th>Status</th><th class="num">Last seen</th></tr></thead><tbody>
    ${list.length ? list.map((x) => `<tr class="click" data-user="${x.uid}" tabindex="0" aria-selected="${x.uid === sel.user}"><td><b>${esc(x.name)}</b>${x.moderator ? ' <span class="pill accent">mod</span>' : ''}<div class="tiny muted">${esc(x.org)} · ${esc(x.city)}</div></td><td class="small">${esc(x.role)}</td><td class="small">${esc(x.plan)}</td><td>${stPill(x.status)}${x.warnings ? `<div class="tiny" style="color:var(--warn)">${x.warnings} warning${x.warnings > 1 ? 's' : ''}</div>` : ''}</td><td class="num small muted">${ago(x.lastActive)}</td></tr>`).join('') : '<tr><td colspan="5" class="empty">No one matches.</td></tr>'}
    </tbody></table></div></div>
    ${u ? `<div class="card" aria-label="Selected person" id="user-detail"><h2 class="h">${esc(u.name)}</h2><div class="row">${stPill(u.status)}<span class="pill">${esc(u.plan)}</span>${u.moderator ? '<span class="pill accent">Moderator</span>' : ''}</div>
      <dl class="kv"><dt>Email</dt><dd>${esc(u.email)}</dd><dt>Role</dt><dd>${esc(u.role)} · ${esc(u.org)}</dd><dt>City</dt><dd>${esc(u.city)}</dd><dt>Joined</dt><dd>${new Date(u.joined).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</dd><dt>Last seen</dt><dd>${ago(u.lastActive)}</dd><dt>Standing</dt><dd>${u.warnings} of 3 warnings · ${u.pauses} pauses in 90 days</dd><dt>User ID</dt><dd class="small muted">${esc(u.uid)}</dd></dl>
      <div class="row">${USER_ACTIONS.filter(([a, , , min]) => canSee(min) && !(a === 'restore' && u.status === 'active') && !(a === 'make_moderator' && u.moderator) && !(a === 'remove_moderator' && !u.moderator) && !(a === 'grant_pro' && u.plan === 'Pro')).map(([a, l, k]) => `<button class="btn sm ${k}" data-useract="${a}">${l}</button>`).join('')}</div>
      <p class="tiny muted" style="margin:0">Staff can’t read private chats. Content reaches moderators only when it’s flagged or reported.</p>
    </div>` : '<div class="card empty">Pick a person to see their account.</div>'}
  </div>`;
}

function vVenues() {
  const list = D0.venues.filter((v) => filters.venue === 'all' || v.status === filters.venue);
  return `<div class="row"><div class="grow"><h1 class="h">Venue verification</h1><p class="sub">Verified venues get a badge, so bands know a booking request is real.</p></div>
    <label class="small muted">Show <select id="f-venue">${[['pending', 'Waiting'], ['verified', 'Verified'], ['rejected', 'Rejected'], ['all', 'All']].map(([v, l]) => `<option value="${v}" ${filters.venue === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
  <div class="grid two">${list.length ? list.map((v) => `<article class="card" aria-labelledby="vn-${v.id}">
    <div class="row"><h2 class="h grow" id="vn-${v.id}">${esc(v.name)}</h2><span class="pill ${v.status === 'verified' ? 'ok' : v.status === 'rejected' ? 'bad' : 'warn'}">${esc(v.status === 'pending' ? 'waiting' : v.status)}</span></div>
    <span class="small muted">${esc(v.city)}${v.cap ? ' · holds ' + v.cap : ''} · claimed by ${esc(v.by)} (${esc(v.email)}) · ${ago(v.submitted)}</span>
    ${(v.evidence || []).length ? `<ul style="margin:0;padding-left:18px" class="small">${v.evidence.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
    ${v.risk ? `<div class="banner">${esc(v.risk)}</div>` : ''}
    ${v.status === 'pending' ? `<div class="row"><button class="btn sm ok" data-venue="${v.id}" data-va="verify">Verify</button><button class="btn sm danger" data-venue="${v.id}" data-va="reject">Reject</button></div>` : ''}
  </article>`).join('') : '<div class="card empty">Nothing here.</div>'}</div>`;
}

function vMoney() {
  const po = D0.payouts, ds = D0.disputes.filter((d) => d.status === 'open');
  return `<div><h1 class="h">Bookings & money</h1><p class="sub">Payouts held for review, disputes between bands and venues, and the latest bookings. Fame Plan never holds band money. Square and PayPal do.</p></div>
  <section class="card"><h2 class="h">Payouts held for review</h2><p class="small muted" style="margin:0">Held automatically when over $2,000, a band’s first payout, or bank details changed in the last 7 days.</p>
    <div class="tablewrap"><table><thead><tr><th>Band</th><th>Venue</th><th class="num">Amount</th><th>Why held</th><th>Status</th><th></th></tr></thead><tbody>
    ${po.length ? po.map((p) => `<tr><td><b>${esc(p.band)}</b></td><td class="small">${esc(p.venue)}</td><td class="num">${money(p.amount)}</td><td class="small muted">${esc(p.reason || '—')}</td><td><span class="pill ${p.status === 'paid' ? 'ok' : p.status === 'held' ? 'bad' : 'warn'}">${esc(p.status === 'review' ? 'Needs review' : p.status)}</span></td><td>${p.status === 'review' ? `<div class="row" style="flex-wrap:nowrap"><button class="btn sm ok" data-money="payout" data-id="${p.id}" data-ma="release">Release</button><button class="btn sm danger" data-money="payout" data-id="${p.id}" data-ma="hold">Hold</button></div>` : ''}</td></tr>`).join('') : '<tr><td colspan="6" class="empty">No payouts waiting.</td></tr>'}
    </tbody></table></div></section>
  <section class="card"><h2 class="h">Open disputes</h2>
    ${ds.length ? ds.map((d) => `<div class="card" style="background:var(--bg)"><div class="row"><b class="grow">${esc(d.title)}</b><span class="pill warn">${money(d.amount)} at stake</span></div><span class="small muted">${esc(d.parties)} · opened ${ago(d.opened)}</span>
      <div class="row"><button class="btn sm" data-money="dispute" data-id="${d.id}" data-ma="resolve_band">Side with the band</button><button class="btn sm" data-money="dispute" data-id="${d.id}" data-ma="resolve_venue">Side with the venue</button><button class="btn sm" data-money="dispute" data-id="${d.id}" data-ma="split">Split the difference</button></div></div>`).join('') : '<p class="muted" style="margin:0">No open disputes.</p>'}
  </section>
  <section class="card"><h2 class="h">Latest bookings</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Venue</th><th>Lineup</th><th>Deal</th><th>Status</th></tr></thead><tbody>${D0.bookings.length ? D0.bookings.map((b) => `<tr>${b.map((c, i) => `<td class="${i === 0 ? '' : 'small'}" style="white-space:nowrap">${esc(c)}</td>`).join('')}</tr>`).join('') : '<tr><td colspan="5" class="empty">No bookings yet.</td></tr>'}</tbody></table></div></section>`;
}

function vControl() {
  if (!draft) draft = JSON.parse(JSON.stringify(D0.config));
  const c = draft, m = c.moderation;
  const changed = JSON.stringify(draft) !== JSON.stringify(D0.config);
  const num = (k, label, step, min, max, hint) => `<label class="stack small" style="gap:4px"><b>${label}</b><input type="number" data-mod-k="${k}" value="${m[k]}" step="${step}" min="${min}" max="${max}" style="width:140px"><span class="tiny muted">${hint}</span></label>`;
  return `<div class="row"><div class="grow"><h1 class="h">App control</h1><p class="sub">Feature switches, safety settings and announcements. Apps pick up changes within a minute.</p></div>
    <button class="btn" data-ctl="reset" ${changed ? '' : 'disabled'}>Undo changes</button><button class="btn primary" data-ctl="save" ${changed ? '' : 'disabled'}>Save changes</button></div>
  ${changed ? '<div class="banner">You have unsaved changes.</div>' : ''}
  ${D0.config.flags.maintenance[0] ? '<div class="banner"><b>Maintenance mode is on.</b> The app is read-only for everyone until you turn it off.</div>' : ''}
  <section class="grid two">
    <div class="card"><h2 class="h">Features</h2>${Object.entries(c.flags).map(([k, f]) => `<div class="flag"><div class="grow"><b>${esc(f[1])}</b><div class="small muted">${esc(f[2])}</div></div><button class="switch" role="switch" aria-checked="${f[0]}" aria-label="${esc(f[1])}" data-flag="${k}"><span></span></button></div>`).join('')}</div>
    <div class="card"><h2 class="h">Safety settings</h2><p class="small muted" style="margin:0">These match the Terms of Service. If you change one, update the Terms too.</p>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">
        ${num('warningsBeforePause', 'Warnings before a pause', 1, 1, 10, 'Default 3')}${num('pauseHours', 'Pause length (hours)', 1, 1, 168, 'Default 24')}
        ${num('pausesBeforeReview', 'Pauses before account review', 1, 1, 10, 'In 90 days. Default 3')}${num('reportsToAutoHide', 'Reports to auto-blur', 1, 1, 20, 'From different people. Default 3')}
        ${num('hateThreshold', 'Prejudice sensitivity', 0.05, 0.1, 0.95, 'Lower flags more. Default 0.50')}${num('threatThreshold', 'Threat sensitivity', 0.05, 0.1, 0.95, 'Lower flags more. Default 0.55')}
      </div>
      <label class="stack small" style="gap:4px"><b>Minimum app version</b><input type="text" data-minver value="${esc(c.minVersion)}" style="width:140px"><span class="tiny muted">Older apps are asked to update.</span></label>
    </div>
  </section>
  <section class="card"><h2 class="h">Send an announcement</h2><p class="small muted" style="margin:0">Shows as a notification and a card on Home. Use sparingly.</p>
    <label class="small">To <select id="an-aud"><option value="everyone">Everyone</option><option value="bands">Band members</option><option value="venues">Venue bookers</option><option value="pro">Pro bands</option></select></label>
    <label class="stack small" style="gap:4px"><b>Title</b><input type="text" id="an-title" maxlength="60" placeholder="e.g. Lineup tagging is here"></label>
    <label class="stack small" style="gap:4px"><b>Message</b><textarea id="an-body" maxlength="280" placeholder="One or two sentences"></textarea></label>
    <div class="row"><button class="btn primary" data-ctl="announce">Send announcement</button><span id="an-err" class="small" role="alert" style="color:var(--warn)"></span></div>
  </section>`;
}

function vAudit() {
  return `<div><h1 class="h">Audit log</h1><p class="sub">Every staff action, who did it and why. Entries can’t be edited or deleted.</p></div>
  <div class="card" style="padding:0"><div class="tablewrap"><table><thead><tr><th>When</th><th>Who</th><th>What</th><th>Target</th><th>Note</th></tr></thead><tbody>
  ${D0.audit.length ? D0.audit.map((a) => `<tr><td class="small muted" style="white-space:nowrap">${ago(a.at)}</td><td class="small">${esc(a.by)}</td><td>${esc(a.what)}</td><td class="small">${esc(a.target || '—')}</td><td class="small muted">${esc(a.note || '')}</td></tr>`).join('') : '<tr><td colspan="5" class="empty">No actions yet.</td></tr>'}
  </tbody></table></div></div>`;
}

function render() {
  const V = { overview: vOverview, moderation: vModeration, people: vPeople, venues: vVenues, money: vMoney, control: vControl, audit: vAudit };
  if (!SECTIONS.find((s) => s[0] === view && canSee(s[3]))) view = 'moderation';
  $('#view').innerHTML = V[view]();
  const dau = $('#ch-dau .chart'); if (dau) wireLine(dau, D0.dau);
  const rev = $('#ch-rev .chart'); if (rev) wireBars(rev, D0.revenue);
}

// ======================================================= EVENTS
const narrow = () => matchMedia('(max-width: 900px)').matches;
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, tr[data-mod], tr[data-user]'); if (!t || t.closest('dialog')) return;
  const ds = t.dataset;
  if (ds.nav) return go(ds.nav);
  if (ds.tbl) { tables[ds.tbl] = !tables[ds.tbl]; return render(); }
  if (ds.mod) { sel.mod = ds.mod; render(); if (narrow()) $('#mod-detail')?.scrollIntoView({ behavior: 'smooth' }); return; }
  if (ds.user) { sel.user = ds.user; render(); if (narrow()) $('#user-detail')?.scrollIntoView({ behavior: 'smooth' }); return; }
  if (ds.show) { shown[ds.show] = true; return render(); }
  if (ds.openuser) { sel.user = ds.openuser; filters.userQ = ''; filters.userRole = ''; return go('people'); }
  if (ds.modact) {
    const it = D0.queue.find((q) => q.id === sel.mod); let note = '';
    if (['suspend_7d', 'terminate'].includes(ds.modact)) { note = await confirmDlg(ds.modact === 'terminate' ? 'End this membership?' : 'Suspend for 7 days?', ds.modact === 'terminate' ? 'The account is disabled and signed out everywhere. They can appeal within 30 days.' : 'They can’t post, comment or message for 7 days.'); if (!note) return; }
    return run(() => api.modAction(it.id, ds.modact, note), 'Done: ' + ds.modact.replace(/_/g, ' ').replace('7d', '7 days'));
  }
  if (ds.useract) {
    const u = D0.users.find((x) => x.uid === sel.user); let note = '';
    if (['suspend_7d', 'terminate', 'make_moderator', 'grant_pro'].includes(ds.useract)) {
      const T = { suspend_7d: ['Suspend ' + u.name + ' for 7 days?', 'They can’t post, comment or message for a week.'], terminate: ['End ' + u.name + '’s membership?', 'Disables the account and signs them out everywhere. Bandmates keep the band’s shared content.'], make_moderator: ['Make ' + u.name + ' a moderator?', 'They’ll see flagged and reported content and can warn and suspend accounts.'], grant_pro: ['Give ' + u.name + '’s band Pro for free?', 'Pro stays on until you remove it. Shows as a $0 plan in revenue.'] }[ds.useract];
      note = await confirmDlg(T[0], T[1], ds.useract === 'suspend_7d' || ds.useract === 'terminate'); if (!note) return;
    }
    return run(() => api.userAction(u.uid, ds.useract, note), u.name + ': ' + ds.useract.replace(/_/g, ' ').replace('7d', '7 days'));
  }
  if (ds.venue) {
    const v = D0.venues.find((x) => x.id === ds.venue);
    const note = await confirmDlg(ds.va === 'verify' ? 'Verify ' + v.name + '?' : 'Reject ' + v.name + '’s claim?', ds.va === 'verify' ? 'They get the verified badge and bands see their requests as trusted.' : 'The claim is closed and ' + v.by + ' is told why.', ds.va !== 'verify'); if (!note) return;
    return run(() => api.venueAction(v.id, ds.va, note), v.name + (ds.va === 'verify' ? ' verified' : ' rejected'));
  }
  if (ds.money) {
    const note = await confirmDlg({ release: 'Release this payout?', hold: 'Hold this payout?', resolve_band: 'Side with the band?', resolve_venue: 'Side with the venue?', split: 'Split the difference?' }[ds.ma], 'Both sides are told. Money moves through Square or PayPal, not Fame Plan.', ds.ma === 'hold'); if (!note) return;
    return run(() => api.moneyAction(ds.money, ds.id, ds.ma, note), 'Done');
  }
  if (ds.flag) { draft.flags[ds.flag][0] = !draft.flags[ds.flag][0]; render(); $(`[data-flag="${ds.flag}"]`)?.focus(); return; }
  if (ds.ctl === 'reset') { draft = null; return render(); }
  if (ds.ctl === 'save') {
    const m = draft.moderation;
    if (!/^\d+\.\d+\.\d+$/.test(draft.minVersion)) return toast('Minimum version must look like 1.2.0', true);
    if ([m.hateThreshold, m.threatThreshold].some((v) => !(v >= 0.1 && v <= 0.95))) return toast('Sensitivity must be between 0.10 and 0.95', true);
    if (['warningsBeforePause', 'pauseHours', 'pausesBeforeReview', 'reportsToAutoHide'].some((k) => !(Number.isInteger(m[k]) && m[k] >= 1))) return toast('Counts must be whole numbers, 1 or more', true);
    const risky = draft.flags.maintenance[0] !== D0.config.flags.maintenance[0] || (!draft.flags.feedFilter[0] && D0.config.flags.feedFilter[0]) || (!draft.flags.signupsOpen[0] && D0.config.flags.signupsOpen[0]);
    const note = await confirmDlg('Save app settings?', risky ? 'This changes maintenance mode, sign-ups or the safety filter. Every user will notice.' : 'Every app picks these up within a minute.', risky); if (!note) return;
    const cfg = draft; draft = null;
    return run(() => api.setConfig(cfg, note), 'Settings saved');
  }
  if (ds.ctl === 'announce') {
    const title = $('#an-title').value.trim(), body = $('#an-body').value.trim(), aud = $('#an-aud').value;
    if (!title || !body) { $('#an-err').textContent = 'Add a title and a message.'; return; }
    const note = await confirmDlg('Send to ' + $('#an-aud').selectedOptions[0].text.toLowerCase() + '?', '“' + title + '”. This can’t be unsent.', false); if (!note) return;
    return run(() => api.broadcast({ audience: aud, title, body, note }), 'Announcement sent');
  }
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-mod], tr[data-user]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'mobsel') return go(t.value);
  if (t.id === 'f-mod') { filters.modStatus = t.value; sel.mod = null; return render(); }
  if (t.id === 'f-role') { filters.userRole = t.value; return render(); }
  if (t.id === 'f-venue') { filters.venue = t.value; return render(); }
  if (t.dataset.modK) { draft.moderation[t.dataset.modK] = Number(t.value); return render(); }
  if (t.hasAttribute('data-minver')) { draft.minVersion = t.value.trim(); return render(); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'f-q') { filters.userQ = e.target.value; const pos = e.target.selectionStart; render(); const el = $('#f-q'); el.focus(); el.setSelectionRange(pos, pos); } });

// ======================================================= START
(async function start() {
  const qs = new URLSearchParams(location.search), cfg = window.FAME_PLAN_FIREBASE, demo = !cfg || qs.has('demo');
  if (demo) { api = demoApi(demoData()); if (qs.get('role') === 'moderator') { api.role = 'moderator'; api.email = 'moderator@demo'; } $('#app').hidden = false; }
  else { $('#signin').hidden = false; api = await liveApi(cfg); $('#app').hidden = false; }
  $('#mode').textContent = api.mode; $('#mode').className = 'pill ' + (api.mode === 'Live' ? 'ok' : 'warn');
  $('#role').textContent = api.role === 'admin' ? 'Admin' : 'Moderator'; $('#who').textContent = api.email;
  try { D0 = await api.load(); } catch (e) { $('#view').innerHTML = `<div class="banner">Couldn’t load: ${esc(e.message || e)}</div>`; return; }
  if (api.role !== 'admin') view = 'moderation';
  renderNav(); render();
})();
</script>
</body>
</html>
