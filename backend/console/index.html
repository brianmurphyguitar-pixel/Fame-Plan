<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fame Plan · Moderation</title>
<style>
:root { --bg:#130F1C; --card:#1E182C; --line:#2E2642; --line2:#3D3354; --ink:#F1ECFA; --ink2:#D3CCE3; --mute:#ADA3C2; --accent:#C69BFF; --warn:#F2B880; --warnbg:#2E2216; --warnline:#6A4A28; --ok:#B5E3B0; --okbg:#1F2E22; --okline:#3E5A3B; --bad:#FF8A8A; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, -apple-system, sans-serif; }
button, select, textarea { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
header h1 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line2); color: var(--ink2); white-space: nowrap; }
.layout { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; min-height: calc(100vh - 57px); }
@media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } #detail { padding: 14px; } #detail { border-top: 1px solid var(--line); } }
#list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.filters { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.filters select { background: var(--card); color: var(--ink); border: 1px solid var(--line2); border-radius: 10px; min-height: 40px; padding: 0 10px; }
.items { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
.item { display: block; width: 100%; text-align: left; background: transparent; color: inherit; border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; }
.item[aria-current="true"] { background: #261C3A; }
.item .top { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.item .what { font-weight: 600; flex: 1; }
.item .snip { color: var(--mute); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; filter: blur(4px); }
.pri-urgent { background: #4A1620; color: #FFB3BD; border-color: #7A2A38; }
.pri-high { background: var(--warnbg); color: var(--warn); border-color: var(--warnline); }
.pri-normal { color: var(--mute); }
#detail { padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 760px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.content { font-size: 16px; white-space: pre-wrap; word-break: break-word; }
.content.blur { filter: blur(7px); user-select: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 110px; }
.stat b { font-size: 18px; }
.stat span { font-size: 12px; color: var(--mute); }
.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line2); background: transparent; color: var(--ink); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #130F1C; }
.btn.ok { background: var(--okbg); border-color: var(--okline); color: var(--ok); }
.btn.warn { background: var(--warnbg); border-color: var(--warnline); color: var(--warn); }
.btn.danger { background: #3A1520; border-color: #7A2A38; color: #FFB3BD; }
textarea { width: 100%; min-height: 70px; background: var(--bg); color: var(--ink); border: 1px solid var(--line2); border-radius: 10px; padding: 10px; }
.muted { color: var(--mute); font-size: 13px; }
.banner { background: var(--warnbg); border: 1px solid var(--warnline); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 13px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--okbg); border: 1px solid var(--okline); color: var(--ok); padding: 10px 16px; border-radius: 12px; }
.empty { padding: 40px 20px; color: var(--mute); text-align: center; }
dialog { background: var(--card); color: var(--ink); border: 1px solid var(--line2); border-radius: 16px; padding: 20px; max-width: 420px; }
dialog::backdrop { background: rgba(10,8,16,.7); }
#signin { display: grid; place-items: center; min-height: 80vh; }
</style>
</head>
<body>
<header>
  <h1>Fame Plan · Moderation</h1>
  <span id="mode" class="pill"></span>
  <span id="who" class="muted"></span>
  <button id="signout" class="btn" hidden>Sign out</button>
</header>

<section id="signin" hidden>
  <div class="card" style="max-width:380px">
    <h2 style="margin:0">Moderators only</h2>
    <p class="muted" style="margin:0">Sign in with the Google account that was given moderator access.</p>
    <button id="google" class="btn primary">Sign in with Google</button>
    <p id="signin-err" class="muted" role="alert"></p>
  </div>
</section>

<div class="layout" id="app" hidden>
  <nav id="list" aria-label="Moderation queue">
    <div class="filters">
      <label class="muted">Show
        <select id="f-status"><option value="open">Open</option><option value="resolved">Resolved</option></select>
      </label>
      <label class="muted">Type
        <select id="f-cat">
          <option value="">All</option><option value="minors">Minors</option><option value="hate">Prejudice</option>
          <option value="threat">Threats</option><option value="reported">Reported</option><option value="account">Accounts</option><option value="appeal">Appeals</option>
        </select>
      </label>
    </div>
    <ul class="items" id="items"></ul>
  </nav>
  <main id="detail" aria-live="polite"><div class="empty">Pick an item from the queue.</div></main>
</div>

<dialog id="confirm">
  <h2 id="c-title" style="margin:0 0 8px;font-size:18px"></h2>
  <p id="c-body" class="muted" style="margin:0 0 14px"></p>
  <div class="row"><button class="btn" value="cancel" id="c-no">Cancel</button><button class="btn danger" id="c-yes">Confirm</button></div>
</dialog>

<script src="config.js"></script>
<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PRI = { urgent: 0, high: 1, normal: 2 };
const CAT = { minors: 'Sexual content involving minors', hate: 'Racial or other prejudice', threat: 'Threat / self-harm aimed at someone', repeat: 'Repeat offender', appeal: 'Appeal' };
const ACTIONS = [
  ['dismiss', 'Dismiss: it’s fine', 'ok', 'Clears the blur and removes the warning.'],
  ['remove', 'Remove content', 'warn', 'Keeps the warning that was already given.'],
  ['remove_and_warn', 'Remove + extra warning', 'warn', 'Counts toward the 24-hour pause.'],
  ['suspend_7d', 'Suspend 7 days', 'danger', 'Can’t sign in to post for a week.'],
  ['terminate', 'End membership', 'danger', 'Disables the account. They can appeal within 30 days.'],
  ['restore', 'Restore account', 'ok', 'Undo a suspension or termination (appeals).']
];

let items = [], sel = null, shown = {}, api = null;

// ---------------- demo data
const now = Date.now(), H = 3600e3;
const DEMO = [
  { id: 'd1', type: 'post', category: 'hate', label: CAT.hate, priority: 'high', status: 'open', text: 'all [group] are criminals, keep them out of our shows', source: 'rules', reports: 1, reasons: ['prejudice'], fun: 1, hurt: 1, authorId: 'u_ricky', bandId: 'Loose Teeth', updatedAt: now - 0.4 * H, standing: { warnings: 2, pauses: 0, status: 'active' } },
  { id: 'd2', type: 'post', category: 'threat', label: CAT.threat, priority: 'normal', status: 'open', text: 'To whoever lifted my pedalboard: f*ck you, go die in a fire.', source: 'rules', reports: 0, reasons: [], fun: 0, hurt: 0, authorId: 'u_sam', bandId: 'The Late Shift', updatedAt: now - 1 * H, standing: { warnings: 1, pauses: 0, status: 'active' } },
  { id: 'd3', type: 'comment', category: null, label: 'Reported by 3 people', priority: 'high', status: 'open', text: 'nobody in this scene wants you around, quit already', source: 'reports', reports: 3, reasons: ['harassment', 'harassment', 'other'], fun: 0, hurt: 2, authorId: 'u_kel', bandId: 'Glass Owls', updatedAt: now - 2 * H, standing: { warnings: 0, pauses: 0, status: 'active' } },
  { id: 'd4', type: 'account', category: 'repeat', label: 'Paused 3 times in 90 days. Decide on membership.', priority: 'high', status: 'open', text: '', authorId: 'u_trev', bandId: '—', updatedAt: now - 5 * H, standing: { warnings: 0, pauses: 3, status: 'review' } },
  { id: 'd5', type: 'appeal', category: 'appeal', label: 'Appeal', priority: 'normal', status: 'open', text: 'It was an inside joke with my drummer, we say it every rehearsal. Please look again.', authorId: 'u_sam', bandId: 'The Late Shift', updatedAt: now - 9 * H, standing: { warnings: 1, pauses: 0, status: 'active' } },
  { id: 'd6', type: 'post', category: 'threat', label: CAT.threat, priority: 'normal', status: 'resolved', resolution: 'cleared_by_band', text: 'lol kys, that tempo', source: 'rules', reports: 0, fun: 2, hurt: 0, authorId: 'u_jo', bandId: 'The Late Shift', updatedAt: now - 30 * H, standing: { warnings: 0, pauses: 0, status: 'active' } }
];

function demoApi() {
  return {
    mode: 'Demo data',
    listen(cb) { cb(DEMO); },
    async act(id, action, note) {
      const it = DEMO.find((x) => x.id === id);
      Object.assign(it, { status: 'resolved', resolution: action, note });
      if (action === 'terminate') it.standing.status = 'terminated';
      if (action === 'suspend_7d') it.standing.status = 'suspended';
      if (action === 'restore') it.standing.status = 'active';
      return { ok: true };
    }
  };
}

// ---------------- live Firebase
async function liveApi(cfg) {
  const V = '11.0.2';
  const [{ initializeApp }, A, F, FN] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-functions.js`)
  ]);
  const app = initializeApp(cfg);
  const auth = A.getAuth(app), db = F.getFirestore(app), fns = FN.getFunctions(app, window.FAME_PLAN_REGION || 'us-east1');
  const act = FN.httpsCallable(fns, 'moderatorAction');
  return new Promise((resolve) => {
    $('#google').onclick = async () => {
      try { await A.signInWithPopup(auth, new A.GoogleAuthProvider()); } catch (e) { $('#signin-err').textContent = e.message; }
    };
    $('#signout').onclick = () => A.signOut(auth);
    A.onAuthStateChanged(auth, async (user) => {
      if (!user) { $('#signin').hidden = false; $('#app').hidden = true; $('#signout').hidden = true; $('#who').textContent = ''; return; }
      const tok = await user.getIdTokenResult(true);
      if (!tok.claims.moderator) { $('#signin-err').textContent = user.email + ' is not a moderator.'; await A.signOut(auth); return; }
      $('#signin').hidden = true; $('#app').hidden = false; $('#signout').hidden = false; $('#who').textContent = user.email;
      resolve({
        mode: 'Live',
        listen(cb) {
          const st = $('#f-status').value;
          const q = F.query(F.collection(db, 'modQueue'), F.where('status', '==', st), F.orderBy('updatedAt', 'desc'), F.limit(200));
          if (this._un) this._un();
          this._un = F.onSnapshot(q, async (snap) => {
            const list = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
            await Promise.all(list.map(async (it) => {
              if (!it.authorId) return;
              const s = await F.getDoc(F.doc(db, 'standing', it.authorId));
              const d = s.exists() ? s.data() : {};
              it.standing = { warnings: d.warnings || 0, pauses: (d.pauses || []).length, status: d.status || 'active', pausedUntil: d.pausedUntil || 0 };
            }));
            cb(list);
          });
        },
        async act(id, action, note) { return (await act({ itemId: id, action, note })).data; }
      });
    });
  });
}

// ---------------- UI
function kindOf(it) { return it.type === 'account' ? 'account' : it.type === 'appeal' ? 'appeal' : (it.category || 'reported'); }
function render() {
  const st = $('#f-status').value, cat = $('#f-cat').value;
  const list = items.filter((i) => (i.status || 'open') === st && (!cat || kindOf(i) === cat))
    .sort((a, b) => (PRI[a.priority] ?? 3) - (PRI[b.priority] ?? 3) || b.updatedAt - a.updatedAt);
  $('#items').innerHTML = list.length ? list.map((i) => `
    <li><button class="item" data-id="${esc(i.id)}" aria-current="${sel === i.id}">
      <div class="top"><span class="what">${esc(i.type === 'account' ? 'Account review' : i.type === 'appeal' ? 'Appeal' : (CAT[i.category] || i.label || 'Reported'))}</span>
      <span class="pill pri-${esc(i.priority || 'normal')}">${esc(i.priority || 'normal')}</span></div>
      <div class="muted">${esc(i.bandId || '')} · ${esc(i.type)} · ${ago(i.updatedAt)}${i.reports ? ' · ' + i.reports + ' report' + (i.reports > 1 ? 's' : '') : ''}</div>
      ${i.text ? `<div class="snip" aria-hidden="true">${esc(i.text)}</div>` : ''}
    </button></li>`).join('') : '<li class="empty">Nothing here. Nice.</li>';
  $('#items').querySelectorAll('.item').forEach((b) => b.onclick = () => { sel = b.dataset.id; render(); detail(); });
}
function ago(t) { const m = Math.round((Date.now() - t) / 60000); return m < 60 ? m + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; }

function detail() {
  const it = items.find((i) => i.id === sel);
  if (!it) { $('#detail').innerHTML = '<div class="empty">Pick an item from the queue.</div>'; return; }
  const s = it.standing || {};
  const blur = it.text && !shown[it.id];
  const resolved = it.status === 'resolved';
  $('#detail').innerHTML = `
    ${it.category === 'minors' ? '<div class="banner"><b>Urgent.</b> Content is already removed and the author suspended. If this is child sexual abuse material, report it to NCMEC (CyberTipline) as required by law, then end the membership.</div>' : ''}
    <div class="card">
      <div class="row"><span class="pill pri-${esc(it.priority)}">${esc(it.priority)}</span><span class="pill">${esc(it.type)}</span><span class="muted">${esc(it.bandId || '')} · ${ago(it.updatedAt)} · flagged by ${esc(it.source || 'reports')}</span></div>
      <h2 style="margin:0;font-size:20px">${esc(it.label || CAT[it.category] || 'Reported')}</h2>
      ${it.text ? `<div class="content ${blur ? 'blur' : ''}" ${blur ? 'aria-hidden="true"' : ''}>${esc(it.text)}</div>
      ${blur ? '<button class="btn" id="show">Show content</button>' : ''}` : ''}
      ${it.reasons && it.reasons.length ? `<div class="muted">Report reasons: ${esc(it.reasons.join(', '))}</div>` : ''}
    </div>
    <div class="card">
      <div class="row">
        <div class="stat"><b>${it.fun || 0}</b><span>said good fun</span></div>
        <div class="stat"><b>${it.hurt || 0}</b><span>said it bothered them</span></div>
        <div class="stat"><b>${it.reports || 0}</b><span>reports</span></div>
        <div class="stat"><b>${s.warnings ?? 0} / 3</b><span>author warnings</span></div>
        <div class="stat"><b>${s.pauses ?? 0}</b><span>pauses (90 days)</span></div>
        <div class="stat"><b>${esc(s.status || 'active')}</b><span>account</span></div>
      </div>
      ${it.category === 'hate' && it.fun ? '<div class="muted">Bandmates calling prejudice “good fun” doesn’t clear it. Judge it against the guidelines.</div>' : ''}
    </div>
    ${resolved ? `<div class="card"><b>Resolved: ${esc(it.resolution)}</b>${it.note ? `<span class="muted">${esc(it.note)}</span>` : ''}</div>` : `
    <div class="card">
      <label for="note" style="font-weight:600">Note for the log (the user doesn’t see this)</label>
      <textarea id="note" placeholder="Why you decided this"></textarea>
      <div class="row">${ACTIONS.filter(([a]) => a !== 'restore' || it.type === 'appeal' || s.status !== 'active').map(([a, l, k, h]) => `<button class="btn ${k}" data-act="${a}" title="${esc(h)}">${esc(l)}</button>`).join('')}</div>
      <p class="muted" style="margin:0">Hover a button for what it does. Every action is logged with your name.</p>
    </div>`}`;
  const sh = $('#show'); if (sh) sh.onclick = () => { shown[it.id] = true; detail(); };
  $('#detail').querySelectorAll('[data-act]').forEach((b) => b.onclick = () => run(it, b.dataset.act));
}

function ask(title, body) {
  return new Promise((res) => {
    const d = $('#confirm'); $('#c-title').textContent = title; $('#c-body').textContent = body;
    $('#c-yes').onclick = () => { d.close(); res(true); }; $('#c-no').onclick = () => { d.close(); res(false); };
    d.showModal();
  });
}
async function run(it, action) {
  const note = ($('#note') || {}).value || '';
  if (['terminate', 'suspend_7d'].includes(action)) {
    const ok = await ask(action === 'terminate' ? 'End this membership?' : 'Suspend for 7 days?',
      action === 'terminate' ? 'The account is disabled and signed out everywhere. They’re told they can appeal within 30 days.' : 'They can’t post or sign in to post for 7 days.');
    if (!ok) return;
    if (!note.trim()) { toast('Add a note explaining why first.'); $('#note').focus(); return; }
  }
  try { await api.act(it.id, action, note); toast('Done: ' + action.replace(/_/g, ' ')); if (api.mode !== 'Live') { render(); detail(); } }
  catch (e) { toast('Failed: ' + (e.message || e)); }
}
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }

async function start() {
  const cfg = window.FAME_PLAN_FIREBASE;
  const demo = !cfg || new URLSearchParams(location.search).has('demo');
  if (demo) { api = demoApi(); $('#app').hidden = false; } else { $('#signin').hidden = false; api = await liveApi(cfg); }
  $('#mode').textContent = api.mode;
  const go = () => api.listen((l) => { items = l; render(); detail(); });
  $('#f-status').onchange = () => { sel = null; if (api.mode === 'Live') go(); else render(); detail(); };
  $('#f-cat').onchange = render;
  go();
}
start();
</script>
</body>
</html>
